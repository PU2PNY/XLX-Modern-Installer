[reflector]
domain = reflector.example.net
ysf_designator = 12345
ysf_port = 42000
dvref_slug = ysf-12345-example
xlxd_service = xlxd.service

[monitor]
network_timeout_seconds = 5
status_file = /var/lib/xlx-registry-monitor/status.json
credentials_file = /etc/xlx-registry-monitor/credentials

[dvref]
base_url = https://dvref.com

# RefCheck hostfile integration is intentionally not enabled in v0.1.0.
# Its hostfiles have separate access-token, rate-limit and redistribution terms.
