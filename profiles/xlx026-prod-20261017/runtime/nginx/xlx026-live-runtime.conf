# XLX026 recovery profile: Live Hub + Live Core V2 edge routes.
location = /api/live-hub-source {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/live.php;
    fastcgi_param SCRIPT_NAME /api/live.php;
    fastcgi_param QUERY_STRING "";
    fastcgi_param XLX026_LIVE_HUB 1;
    fastcgi_connect_timeout 1s;
    fastcgi_send_timeout 3s;
    fastcgi_read_timeout 3s;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
}
location = /api/live-stream {
    proxy_pass http://127.0.0.1:8091/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering no always;
    add_header X-XLX026-Live-Transport sse always;
}
location = /api/live-v2/ws {
    proxy_pass http://127.0.0.1:8092/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
}
location = /api/live-v2/health {
    proxy_pass http://127.0.0.1:8092/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    access_log off;
}
location = /api/live-v2/snapshot {
    proxy_pass http://127.0.0.1:8092/snapshot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    access_log off;
}
location = /sw.js {
    try_files $uri =404;
    expires -1;
    access_log off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
