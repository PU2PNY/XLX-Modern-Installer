# Shadow-only integration. This file must not be installed unless the
# documented ENV equivalence gate has passed and an exact xuvd rollback exists.
[Unit]
Wants=helix-voice-shadow.service
After=helix-voice-shadow.service

[Service]
SupplementaryGroups=helix-voice
Environment=XLX_HELIX_MODE=shadow
Environment=XLX_HELIX_OBSERVE_SOCKET=/run/helix-voice/observe.sock
