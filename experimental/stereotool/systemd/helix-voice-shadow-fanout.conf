# Route Helix to a private observer socket. xlx-pcm-shadow-router owns the
# original /run/helix-voice/observe.sock used by the already-running xuvd.
# Preserve the shared runtime directory so a Helix-only restart cannot unlink
# the router's observer socket while xuvd continues to run.
[Service]
RuntimeDirectoryPreserve=yes
ExecStart=
ExecStart=/opt/helix-voice/bin/helix-daemon --pcm-observe /run/helix-voice/helix.sock
