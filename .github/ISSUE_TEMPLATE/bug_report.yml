name: Bug report / Relatar problema
description: Report an installation, dashboard or maintenance problem / Relate um problema de instalação, painel ou manutenção
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never paste passwords, tokens, private keys, user databases or production backups.
        Obrigado por relatar o problema. Nunca envie senhas, tokens, chaves privadas, bancos de usuários ou backups de produção.

  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - Full installation / Instalação completa
        - Pre-flight check / Pré-validação
        - Dashboard installation / Instalação do dashboard
        - Dashboard language / Idioma do dashboard
        - XLXD service
        - Apache / HTTPS
        - Firewall / network
        - Backup / recovery
        - Documentation
        - Other / Outro
    validations:
      required: true

  - type: input
    id: debian
    attributes:
      label: Debian version / Versão do Debian
      placeholder: "Debian GNU/Linux 12"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture / Arquitetura
      placeholder: "x86_64"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Project commit / Commit do projeto
      description: "Run / Execute: git rev-parse HEAD"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened / O que aconteceu
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / Saída relevante
      description: Remove sensitive data before pasting / Remova dados sensíveis antes de colar
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check / Verificação de segurança
      options:
        - label: I removed passwords, tokens, private keys and personal data / Removi senhas, tokens, chaves privadas e dados pessoais
          required: true
