name: Restore public production parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-public-production-parity.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild validated support and simulator parity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 2786d77cbcc24248eba6b41da626948ec6203f36

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL --retry 3 --max-time 30 https://xlx026.net/suporte -o "$work/suporte.html"
          curl -fsSL --retry 3 --max-time 30 https://xlx026.net/assets/support-native.css -o "$work/support-native.css"
          curl -fsSL --retry 3 --max-time 30 https://xlx026.net/assets/support-native.js -o "$work/support-native.js"
          base=https://raw.githubusercontent.com/PU2PNY/XLX-Modern-Installer/699fdb26fa6c921b5535cb474ff6c664ac57b59c/dashboard
          for f in assets/simulado-anatel.css assets/simulado-anatel-questions.js assets/simulado-anatel-engine.js assets/simulado-anatel.js simulado-anatel-view.php simulado-anatel/index.php; do
            mkdir -p "$work/historical/$(dirname "$f")"
            curl -fsSL --retry 3 --max-time 30 "$base/$f" -o "$work/historical/$f"
          done

          python3 - "$work" <<'PY'
          from pathlib import Path
          import sys
          work=Path(sys.argv[1])

          html=(work/'suporte.html').read_text(encoding='utf-8')
          start=html.index('<div class="support-native">')
          seo_start=html.index('<!-- XLX026_SEO_AI_BUSCADORES_V2_INCLUDE -->', start)
          seo_end=html.index('<!-- /XLX026_SEO_AI_BUSCADORES_V2_INCLUDE -->', seo_start)+len('<!-- /XLX026_SEO_AI_BUSCADORES_V2_INCLUDE -->')
          content=(html[start:seo_start]+html[seo_start:seo_end]).strip()+"\n"
          content=content.replace('XLX026 Brasil','{{REFLECTOR_NAME}} Brasil').replace('XLX026','{{REFLECTOR_NAME}}').replace('xlx026.net','{{DOMAIN}}').replace('data-filter="xlx026"','data-filter="reflector"')
          Path('dashboard/support-native.php').write_text(content,encoding='utf-8')
          Path('dashboard/assets/support-native.css').write_text((work/'support-native.css').read_text(encoding='utf-8'),encoding='utf-8')
          js=(work/'support-native.js').read_text(encoding='utf-8')
          js=js.replace('category: "xlx026"','category: "reflector"').replace('YSF72426','YSF{{YSF_ID}}').replace('XLX026','{{REFLECTOR_NAME}}').replace('xlx026.net','{{DOMAIN}}')
          Path('dashboard/assets/support-native.js').write_text(js,encoding='utf-8')

          base=work/'historical'
          for rel in ['assets/simulado-anatel.css','assets/simulado-anatel-questions.js','assets/simulado-anatel-engine.js','assets/simulado-anatel.js']:
              data=(base/rel).read_text(encoding='utf-8').replace('XLX026 Brasil','{{REFLECTOR_NAME}} Brasil').replace('XLX026','{{REFLECTOR_NAME}}').replace('xlx026.net','{{DOMAIN}}')
              dst=Path('dashboard')/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(data,encoding='utf-8')
          view=(base/'simulado-anatel-view.php').read_text(encoding='utf-8').replace('XLX026 Brasil','{{REFLECTOR_NAME}} Brasil').replace('XLX026','{{REFLECTOR_NAME}}').replace('xlx026.net','{{DOMAIN}}')
          Path('dashboard/simulado-anatel-view.php').write_text(view,encoding='utf-8')
          Path('dashboard/simulado-anatel').mkdir(parents=True,exist_ok=True)
          Path('dashboard/simulado-anatel/index.php').write_text((base/'simulado-anatel/index.php').read_text(encoding='utf-8'),encoding='utf-8')

          p=Path('dashboard/index.php'); s=p.read_text(encoding='utf-8')
          s=s.replace("$allowed = ['ao-vivo','modulos','conectados','ranking','refletores','digital-lab','certificado'];","$allowed = ['ao-vivo','modulos','conectados','ranking','refletores','digital-lab','certificado','suporte','simulado-anatel'];")
          s=s.replace("    'conectados' => 'Conectados',\n    'digital-lab' => 'APRS / D-PRS',","    'conectados' => 'Conectados',\n    'suporte' => 'Suporte',\n    'digital-lab' => 'APRS / D-PRS',")
          s=s.replace("    'certificado' => 'Certificado',\n    'ranking' => 'Ranking',","    'ranking' => 'Ranking',\n    'certificado' => 'Certificado',\n    'simulado-anatel' => 'Simulado ANATEL',")
          s=s.replace(" 'certificado'=>['title'=>'Certificado — {{REFLECTOR_NAME}}','description'=>'Emissão e validação pública de certificados com QR Code verificável.']\n];"," 'certificado'=>['title'=>'Certificado — {{REFLECTOR_NAME}}','description'=>'Emissão e validação pública de certificados com QR Code verificável.'],\n 'suporte'=>['title'=>'Suporte — {{REFLECTOR_NAME}}','description'=>'Tutoriais, vídeos, downloads e referências para DMR, D-STAR, C4FM/YSF, Pi-Star e WPSD.'],\n 'simulado-anatel'=>['title'=>'Simulado ANATEL 2026 para Radioamador — {{REFLECTOR_NAME}}','description'=>'Simulado educacional e não oficial para estudo do Serviço de Radioamador, baseado em normas e fontes oficiais.']\n];")
          s=s.replace("$canonical = 'https://{{REFLECTOR_DOMAIN}}/' . ($page === 'ao-vivo' ? '' : '?page=' . rawurlencode($page));","$canonical = $page === 'simulado-anatel' ? 'https://{{REFLECTOR_DOMAIN}}/simulado-anatel/' : ('https://{{REFLECTOR_DOMAIN}}/' . ($page === 'ao-vivo' ? '' : '?page=' . rawurlencode($page)));" )
          needle="<title><?=htmlspecialchars($meta['title'], ENT_QUOTES, 'UTF-8')?></title><link rel=\"stylesheet\" href=\"assets/app.css?v=20260828-xlxmodern-mirror-4\">"
          s=s.replace(needle,needle+"\n<?php if ($page === 'suporte'): ?><link rel=\"stylesheet\" href=\"assets/support-native.css?v=production-parity\"><?php endif; ?>\n<?php if ($page === 'simulado-anatel'): ?><link rel=\"stylesheet\" href=\"assets/simulado-anatel.css?v=production-parity\"><?php endif; ?>",1)
          needle="<?php elseif ($page === 'refletores'): ?>"
          s=s.replace(needle,"<?php elseif ($page === 'suporte'): ?>\n <?php require __DIR__.'/support-native.php'; ?>\n<?php elseif ($page === 'simulado-anatel'): ?>\n <?php require __DIR__.'/simulado-anatel-view.php'; ?>\n"+needle,1)
          needle='<div id="toastStack" class="toast-stack"></div><script src="assets/mtr.js?v=5"></script><script src="assets/app.js?v=20260907-production-parity"></script>'
          repl='<div id="toastStack" class="toast-stack"></div><?php if ($page === \'suporte\'): ?><script src="assets/support-native.js?v=production-parity"></script><?php endif; ?><script src="assets/mtr.js?v=5"></script><script src="assets/app.js?v=20260907-production-parity"></script>\n<?php if ($page === \'simulado-anatel\'): ?><script src="assets/simulado-anatel-questions.js?v=production-parity"></script><script src="assets/simulado-anatel-engine.js?v=production-parity"></script><script src="assets/simulado-anatel.js?v=production-parity"></script><?php endif; ?>'
          s=s.replace(needle,repl,1); p.write_text(s,encoding='utf-8')

          p=Path('modules/70-nginx.sh'); s=p.read_text(encoding='utf-8')
          s=s.replace('    conectados /conectados;\n    ranking /ranking;', '    conectados /conectados;\n    suporte /suporte;\n    simulado-anatel /simulado-anatel/;\n    ranking /ranking;')
          s=s.replace('location ~ ^/(ao-vivo|modulos|conectados|ranking|refletores|certificado|aprs-dprs)/\\$ {', 'location ~ ^/(ao-vivo|modulos|conectados|suporte|ranking|refletores|certificado|aprs-dprs)/\\$ {')
          s=s.replace('location ~ ^/(ao-vivo|modulos|conectados|ranking|refletores|certificado)\\$ {', 'location ~ ^/(ao-vivo|modulos|conectados|suporte|ranking|refletores|certificado)\\$ {')
          marker='write_https_site(){'; http,https=s.split(marker,1); anchor='    location = /aprs-dprs {\n'
          http_block='''    location = /simulado-anatel { return 301 /simulado-anatel/; }\n    location = /simulado-anatel/ {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME \\$document_root/index.php;\n        fastcgi_param SCRIPT_NAME /index.php;\n        fastcgi_param QUERY_STRING page=simulado-anatel&\\$args;\n        fastcgi_param HTTPS off;\n        fastcgi_param HTTP_X_FORWARDED_PROTO http;\n        fastcgi_connect_timeout 2s; fastcgi_send_timeout 15s; fastcgi_read_timeout 15s;\n        fastcgi_pass unix:/run/php/php8.2-fpm.sock;\n    }\n'''
          https_block='''    location = /simulado-anatel { return 301 https://$DOMAIN/simulado-anatel/; }\n    location = /simulado-anatel/ {\n        include fastcgi_params;\n        fastcgi_param SCRIPT_FILENAME \\$document_root/index.php;\n        fastcgi_param SCRIPT_NAME /index.php;\n        fastcgi_param QUERY_STRING page=simulado-anatel&\\$args;\n        fastcgi_param HTTPS on;\n        fastcgi_param SERVER_PORT 443;\n        fastcgi_param HTTP_X_FORWARDED_PROTO https;\n        fastcgi_connect_timeout 2s; fastcgi_send_timeout 15s; fastcgi_read_timeout 15s;\n        fastcgi_pass unix:/run/php/php8.2-fpm.sock;\n    }\n'''
          http=http.replace(anchor,http_block+anchor,1); https=https.replace(anchor,https_block+anchor,1)
          p.write_text(http+marker+https,encoding='utf-8')

          p=Path('dashboard/install/fresh-install-parity.sh'); s=p.read_text(encoding='utf-8')
          old='for page in ao-vivo conectados modulos digital-lab certificado refletores; do'; new='for page in ao-vivo conectados modulos digital-lab certificado suporte simulado-anatel refletores; do'
          s=s.replace(old,new,1); pos=s.index(new); end=s.index('\ndone',pos)+len('\ndone')
          extra='''\nfor required in support-native.php assets/support-native.css assets/support-native.js simulado-anatel-view.php simulado-anatel/index.php assets/simulado-anatel.css assets/simulado-anatel-questions.js assets/simulado-anatel-engine.js assets/simulado-anatel.js; do\n    [ -s "$DASH/$required" ] || fail "Required public parity component missing: $required"\ndone\nok "Support and ANATEL simulator production-parity components are present."'''
          s=s[:end]+extra+s[end:]; p.write_text(s,encoding='utf-8')
          PY

          cat > tests/test-public-route-parity.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          fail(){ printf '[FAIL] %s\n' "$*" >&2; exit 1; }
          ok(){ printf '[OK] %s\n' "$*"; }
          for f in dashboard/support-native.php dashboard/assets/support-native.css dashboard/assets/support-native.js dashboard/simulado-anatel-view.php dashboard/simulado-anatel/index.php dashboard/assets/simulado-anatel.css dashboard/assets/simulado-anatel-questions.js dashboard/assets/simulado-anatel-engine.js dashboard/assets/simulado-anatel.js; do [[ -s "$ROOT/$f" ]] || fail "missing public parity component: $f"; done
          grep -Fq "'suporte' => 'Suporte'" "$ROOT/dashboard/index.php" || fail 'Support nav route missing'
          grep -Fq "'simulado-anatel' => 'Simulado ANATEL'" "$ROOT/dashboard/index.php" || fail 'ANATEL simulator nav route missing'
          grep -Fq "require __DIR__.'/support-native.php'" "$ROOT/dashboard/index.php" || fail 'Support view wiring missing'
          grep -Fq "require __DIR__.'/simulado-anatel-view.php'" "$ROOT/dashboard/index.php" || fail 'ANATEL simulator view wiring missing'
          grep -Fq 'suporte /suporte;' "$ROOT/modules/70-nginx.sh" || fail 'Support Nginx redirect mapping missing'
          grep -Fq 'simulado-anatel /simulado-anatel/;' "$ROOT/modules/70-nginx.sh" || fail 'ANATEL simulator Nginx mapping missing'
          grep -Fq 'location = /simulado-anatel/' "$ROOT/modules/70-nginx.sh" || fail 'ANATEL simulator canonical route missing'
          grep -Fq 'suporte simulado-anatel refletores' "$ROOT/dashboard/install/fresh-install-parity.sh" || fail 'Support/simulator runtime parity probe missing'
          php -l "$ROOT/dashboard/index.php" >/dev/null
          php -l "$ROOT/dashboard/support-native.php" >/dev/null
          php -l "$ROOT/dashboard/simulado-anatel-view.php" >/dev/null
          php -l "$ROOT/dashboard/simulado-anatel/index.php" >/dev/null
          bash -n "$ROOT/modules/70-nginx.sh"
          bash -n "$ROOT/dashboard/install/fresh-install-parity.sh"
          ok 'Support and ANATEL simulator source/route parity is guarded'
          EOF
          sed -i 's/^          //' tests/test-public-route-parity.sh
          chmod 0755 tests/test-public-route-parity.sh

          php -l dashboard/index.php >/dev/null
          php -l dashboard/support-native.php >/dev/null
          php -l dashboard/simulado-anatel-view.php >/dev/null
          php -l dashboard/simulado-anatel/index.php >/dev/null
          node --check dashboard/assets/support-native.js
          node --check dashboard/assets/simulado-anatel-engine.js
          node --check dashboard/assets/simulado-anatel.js
          bash -n modules/70-nginx.sh
          bash -n dashboard/install/fresh-install-parity.sh
          bash tests/test-public-route-parity.sh
          bash tests/test-current-panel-runtime-parity.sh
          bash tests/test-install-flow.sh
          git diff --check

          declare -A expected=(
            [dashboard/index.php]=34b58b068a3b47baab2ed7e89c9316711722ffcd
            [dashboard/install/fresh-install-parity.sh]=661ebd7740346dc09f1aa98ee1c15407ec31d7fa
            [modules/70-nginx.sh]=0eae2cda486a22ccb809f98359c2c02065b40bd6
            [dashboard/support-native.php]=e480b22a45c4ad70e34914b010c7ac4952dcf3fa
            [dashboard/assets/support-native.css]=aff1427b1b7c511876258ee801aedf32cd73b44c
            [dashboard/assets/support-native.js]=38c7b93842e28f118769b61094d6ca3bd5b71379
            [dashboard/simulado-anatel-view.php]=c9e7d1f5a2a788709581064eca4e3a530e47088a
            [dashboard/simulado-anatel/index.php]=34cec9a9d2d23954a82b5462e28199ae4d1242b6
            [dashboard/assets/simulado-anatel.css]=ba914b6f2487e2dbba298cc466e824c8b2e588d2
            [dashboard/assets/simulado-anatel-questions.js]=2111e7a7c76a47e722c93ed627211cc7af7cb0ea
            [dashboard/assets/simulado-anatel-engine.js]=2c83eea5f4b52787398614e00f091b1ff111dad7
            [dashboard/assets/simulado-anatel.js]=b7d512e66f13cef98ad1850e7af628d47548bca0
            [tests/test-public-route-parity.sh]=712dbfe3686e42d9f5c017709cdfa4ea678c0f41
          )
          for f in "${!expected[@]}"; do test "$(git hash-object "$f")" = "${expected[$f]}" || { echo "hash mismatch: $f"; exit 91; }; done

          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add dashboard modules/70-nginx.sh tests/test-public-route-parity.sh
          git rm .github/workflows/restore-public-production-parity.yml
          git commit -m 'Restore Support and ANATEL simulator parity'
          git push origin HEAD:main
