name: Apply canonical navigation alignment
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alignment
        run: python3 .github/canonical-navigation-fix.py
      - name: Validate alignment
        run: |
          bash -n modules/70-nginx.sh
          bash -n tests/test-canonical-navigation.sh
          php -l dashboard/index.php
          bash tests/test-canonical-navigation.sh
          bash tests/test-admin-slug-contract.sh
          bash tests/test-admin-route-readiness.sh
          git diff --check
          bash tests/run-all.sh
      - name: Publish alignment
        run: |
          rm -f .github/canonical-navigation-fix.py
          rm -f .github/workflows/apply-canonical-navigation-fix.yml
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align dashboard navigation with canonical routes'
          git push origin HEAD:main
