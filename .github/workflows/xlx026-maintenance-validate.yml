name: XLX026 Maintenance Validation

on:
  push:
    branches:
      - feature/xlx026-maint-20260823
    paths:
      - 'maintenance/**'
      - 'ops/**'
      - '.github/workflows/xlx026-maintenance-validate.yml'
  pull_request:
    paths:
      - 'maintenance/**'
      - 'ops/**'
      - '.github/workflows/xlx026-maintenance-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/readonly-smoke.sh
          bash -n ops/agent/xlx026-github-agent.sh
          bash -n ops/agent/xlx026-github-executor.sh
          bash -n ops/agent/bootstrap.sh
          bash -n ops/agent/upgrade-v5.sh
          bash -n ops/agent/upgrade-v6.sh
          bash -n ops/root/xlx026-safe-backup.sh
          bash -n ops/root/xlx026-golden-lab-v2.sh
          bash -n ops/root/xlx026-core-260-candidate-v1.sh
          bash -n ops/root/xlx026-core-260-candidate-finalize-v1.sh

      - name: Validate maintenance control schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, re
          with open('maintenance/control.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('schema') == 1
          assert isinstance(d.get('enabled'), bool)
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,80}', d.get('job_id',''))
          assert d.get('action') in {'idle','readonly_smoke','backup_only','golden_lab','candidate_build','candidate_finalize'}
          PY

      - name: Verify pinned hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum ops/agent/xlx026-github-agent.sh | awk '{print $1}')" = "e37cf662240a5893203cda7c371a36aa056b0f5c2d484360e9632c1ad9334459"
          test "$(sha256sum ops/agent/xlx026-github-agent.service | awk '{print $1}')" = "16c536e78e67c4aad1f86690f11927ee67f4d2d085437958c1e8810073338e9c"
          test "$(sha256sum ops/agent/xlx026-github-agent.timer | awk '{print $1}')" = "61f1a6971b6349570e02c60576ddf5507bf5183ab8a532ef1b40a6f656f3022e"
          test "$(sha256sum ops/agent/xlx026-github-executor.sh | awk '{print $1}')" = "02e0d382718e5d97a4f52e538d01da034a1fbb277f873f63e2fce53fa26157bc"
          test "$(sha256sum ops/agent/xlx026-github-executor.service | awk '{print $1}')" = "3fc5e6f199dcd210aa6ebcc496bd842c523485470003ebcc496bd842c523485470003ebc"