name: Apply production sync v2

on:
  push:
    branches:
      - 'sync/production-20260813'
    paths:
      - '.sync-payload/RUN2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/production-20260813
          fetch-depth: 0

      - name: Reconstruct validated overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .sync-payload/core-overlay.b64.part* | base64 -d > /tmp/core-overlay.tar.gz
          echo 'bd8284e45fcd8d6937dcd240dff13eab3b518b683eb0afae7ebda79c79e98a3e  /tmp/core-overlay.tar.gz' | sha256sum -c -
          if tar -tzf /tmp/core-overlay.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path in overlay' >&2
            exit 1
          fi
          mkdir -p /tmp/core-overlay
          tar -xzf /tmp/core-overlay.tar.gz -C /tmp/core-overlay
          test "$(find /tmp/core-overlay -type f | wc -l)" -eq 23

      - name: Apply dashboard-only overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a /tmp/core-overlay/ dashboard/

      - name: Validate synchronized source
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find dashboard -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find dashboard/assets -type f -name '*.js' -print0)
          bash -n install.sh
          bash -n update.sh
          bash -n modules/67-aprs-dprs.sh
          grep -F 'CONNECTED_COUNT_VOICE_V103_NO_TX' dashboard/assets/app.js
          grep -F "const reflector='{{REFLECTOR_NAME}}';" dashboard/assets/app.js
          grep -F '/var/cache/xlx-ham-weather' dashboard/api/ham-weather.php
          grep -F '/var/cache/xlx-dashboard' dashboard/api/common.php
          ! grep -REn 'xlx026\.net|XLX026 Brasil|YSF 72426|TG 4003|82\.152\.175\.30|/var/cache/xlx026' \
            dashboard/api/common.php dashboard/api/ham-weather.php dashboard/api/live.php dashboard/api/mtr.php \
            dashboard/assets/app.js dashboard/assets/install-app.js dashboard/llms.txt dashboard/robots.txt dashboard/site.webmanifest
          git diff --check

      - name: Commit synchronized production core
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          rm -rf .sync-payload
          git add dashboard .sync-payload
          git diff --cached --check
          git commit -m 'Sync validated production core into universal dashboard'
          git push origin HEAD:sync/production-20260813
