name: One-shot six-locale Admin parity

on:
  push:
    paths:
      - .github/workflows/one-shot-admin-six-locales.yml

permissions:
  contents: write

jobs:
  admin-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deterministic offline translator
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'argostranslate==1.9.6'

      - name: Generate complete Admin locale catalogs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import argostranslate.package
          import argostranslate.translate

          root=Path('.')
          en_path=root/'control/admin-en.json'
          pt_to_en=json.loads(en_path.read_text(encoding='utf-8'))

          # Preserve radio/protocol identifiers and file/service names while translating
          # the surrounding operational language.
          protected_tokens=[
              'XLXD','XLX','D-STAR','DMR','RadioID.net','RadioID','users.db','SQL','CSV',
              'YSF','C4FM','Wires-X','CallingHome','Interlink','APRS','DV','GPS','TA','TX','RX',
              'N0CALL','PU2*','PU5*','xlxd.service','SHA','Data FR','Voice FR','Mode 2',
              '<strong>','</strong>','203.0.113.15','203.0.113.5','example.org'
          ]

          overrides={
            'es': {
              'Restricted access':'Acceso restringido','Username':'Usuario','Password':'Contraseña','Sign in':'Iniciar sesión',
              'Sign out':'Cerrar sesión','Private technical area':'Área técnica privada','Reflector control':'Control del reflector',
              'Operational Health':'Salud operativa','Whitelist':'Lista blanca','Blacklist':'Lista negra','Restart XLXD':'Reiniciar XLXD',
              'Search records':'Buscar registros','Save and synchronize':'Guardar y sincronizar','Update callsign database':'Actualizar la base de indicativos',
              'Integrity and tests':'Integridad y pruebas','Recent backups':'Copias de seguridad recientes','Recent logs':'Registros recientes',
              'Action':'Acción','State':'Estado','Detail':'Detalle','Search':'Buscar','Edit':'Editar','Remove':'Eliminar','Check':'Comprobar',
              'Check now':'Comprobar ahora','Validation':'Validación','Expected':'Esperado','Result':'Resultado','Country':'País','City':'Ciudad',
              'Name':'Nombre','Last name':'Apellido','Callsign':'Indicativo','Modules':'Módulos','Processes':'Procesos','Protocol':'Protocolo',
              'Active TX':'TX activa','History':'Historial','Generated':'Generado','Warnings':'Avisos'
            },
            'fr': {
              'Restricted access':'Accès restreint','Username':'Utilisateur','Password':'Mot de passe','Sign in':'Se connecter',
              'Sign out':'Se déconnecter','Private technical area':'Zone technique privée','Reflector control':'Contrôle du réflecteur',
              'Operational Health':'Santé opérationnelle','Whitelist':'Liste blanche','Blacklist':'Liste noire','Restart XLXD':'Redémarrer XLXD',
              'Search records':'Rechercher des enregistrements','Save and synchronize':'Enregistrer et synchroniser','Update callsign database':'Mettre à jour la base des indicatifs',
              'Integrity and tests':'Intégrité et tests','Recent backups':'Sauvegardes récentes','Recent logs':'Journaux récents',
              'Action':'Action','State':'État','Detail':'Détail','Search':'Rechercher','Edit':'Modifier','Remove':'Supprimer','Check':'Vérifier',
              'Check now':'Vérifier maintenant','Validation':'Validation','Expected':'Attendu','Result':'Résultat','Country':'Pays','City':'Ville',
              'Name':'Nom','Last name':'Nom de famille','Callsign':'Indicatif','Modules':'Modules','Processes':'Processus','Protocol':'Protocole',
              'Active TX':'TX active','History':'Historique','Generated':'Généré','Warnings':'Avertissements'
            },
            'de': {
              'Restricted access':'Eingeschränkter Zugriff','Username':'Benutzername','Password':'Passwort','Sign in':'Anmelden',
              'Sign out':'Abmelden','Private technical area':'Privater Technikbereich','Reflector control':'Reflektorsteuerung',
              'Operational Health':'Betriebszustand','Whitelist':'Positivliste','Blacklist':'Sperrliste','Restart XLXD':'XLXD neu starten',
              'Search records':'Einträge durchsuchen','Save and synchronize':'Speichern und synchronisieren','Update callsign database':'Rufzeichendatenbank aktualisieren',
              'Integrity and tests':'Integrität und Tests','Recent backups':'Aktuelle Sicherungen','Recent logs':'Aktuelle Protokolle',
              'Action':'Aktion','State':'Status','Detail':'Detail','Search':'Suchen','Edit':'Bearbeiten','Remove':'Entfernen','Check':'Prüfen',
              'Check now':'Jetzt prüfen','Validation':'Validierung','Expected':'Erwartet','Result':'Ergebnis','Country':'Land','City':'Stadt',
              'Name':'Name','Last name':'Nachname','Callsign':'Rufzeichen','Modules':'Module','Processes':'Prozesse','Protocol':'Protokoll',
              'Active TX':'Aktive TX','History':'Verlauf','Generated':'Erzeugt','Warnings':'Warnungen'
            },
            'it': {
              'Restricted access':'Accesso riservato','Username':'Nome utente','Password':'Password','Sign in':'Accedi',
              'Sign out':'Esci','Private technical area':'Area tecnica privata','Reflector control':'Controllo del riflettore',
              'Operational Health':'Stato operativo','Whitelist':'Lista consentiti','Blacklist':'Lista bloccati','Restart XLXD':'Riavvia XLXD',
              'Search records':'Cerca registri','Save and synchronize':'Salva e sincronizza','Update callsign database':'Aggiorna database nominativi',
              'Integrity and tests':'Integrità e test','Recent backups':'Backup recenti','Recent logs':'Log recenti',
              'Action':'Azione','State':'Stato','Detail':'Dettaglio','Search':'Cerca','Edit':'Modifica','Remove':'Rimuovi','Check':'Verifica',
              'Check now':'Verifica ora','Validation':'Validazione','Expected':'Previsto','Result':'Risultato','Country':'Paese','City':'Città',
              'Name':'Nome','Last name':'Cognome','Callsign':'Nominativo','Modules':'Moduli','Processes':'Processi','Protocol':'Protocollo',
              'Active TX':'TX attiva','History':'Cronologia','Generated':'Generato','Warnings':'Avvisi'
            }
          }

          argostranslate.package.update_package_index()
          packages=argostranslate.package.get_available_packages()
          for target in ('es','fr','de','it'):
              pkg=next((p for p in packages if p.from_code=='en' and p.to_code==target),None)
              if pkg is None:
                  raise SystemExit(f'Argos package en->{target} unavailable')
              argostranslate.package.install_from_path(pkg.download())

              out={}
              for pt,en in pt_to_en.items():
                  if en in overrides[target]:
                      translated=overrides[target][en]
                  else:
                      protected=en
                      reverse={}
                      for i,token in enumerate(sorted(protected_tokens,key=len,reverse=True)):
                          if token in protected:
                              marker=f'ZXQ{i}QXZ'
                              protected=protected.replace(token,marker)
                              reverse[marker]=token
                      translated=argostranslate.translate.translate(protected,'en',target)
                      for marker,token in reverse.items():
                          translated=translated.replace(marker,token)
                      translated=' '.join(translated.split()) if '\n' not in translated else translated
                  out[pt]=translated

              if set(out)!=set(pt_to_en):
                  raise SystemExit(f'catalog key mismatch for {target}')
              (root/f'control/admin-{target}.json').write_text(
                  json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
              )
          PY

      - name: Extend Admin builder and installer language parity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('control/build-admin.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('usage: build-admin.py INDEX.php [pt-BR|en]', 'usage: build-admin.py INDEX.php [pt-BR|en|es|fr|de|it]')
          old='''if locale in {"en","en-us","en_us"}:\n    mapping=json.loads((Path(__file__).with_name("admin-en.json")).read_text(encoding="utf-8"))\n    for old in sorted(mapping,key=len,reverse=True): s=s.replace(old,mapping[old])\n    s=s.replace('lang="pt-BR"','lang="en"')\nelif locale not in {"pt","pt-br","pt_br"}:\n    raise SystemExit("Admin supports installer languages pt-BR or en")\n'''
          new='''aliases={"pt":"pt-BR","pt-br":"pt-BR","pt_br":"pt-BR","en-us":"en","en_us":"en"}\nlocale=aliases.get(locale,locale)\nsupported={"pt-BR","en","es","fr","de","it"}\nif locale not in supported:\n    raise SystemExit("Admin supports dashboard languages pt-BR, en, es, fr, de or it")\nif locale != "pt-BR":\n    mapping_path=Path(__file__).with_name(f"admin-{locale}.json")\n    mapping=json.loads(mapping_path.read_text(encoding="utf-8"))\n    base=json.loads((Path(__file__).with_name("admin-en.json")).read_text(encoding="utf-8"))\n    if set(mapping) != set(base):\n        raise SystemExit(f"Admin locale catalog key mismatch: {locale}")\n    for old in sorted(mapping,key=len,reverse=True): s=s.replace(old,mapping[old])\n    s=s.replace('lang="pt-BR"',f'lang="{locale}"')\n'''
          if old not in s:
              raise SystemExit('build-admin language block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('modules/69-admin-page.sh')
          s=p.read_text(encoding='utf-8')
          old='''# Admin intentionally supports two complete interfaces only.  The dashboard\n# can use six languages, while the private operational screen stays PT-BR or\n# English so its safety prompts and maintenance actions remain unambiguous.\nADMIN_UI_LANG='en'\n[[ "$UI_LANG" == pt || "$UI_LANG" == pt-BR || "$UI_LANG" == pt_BR ]] && ADMIN_UI_LANG='pt-BR'\npython3 "$ROOT/control/build-admin.py" "$WORK/index.php" "$ADMIN_UI_LANG"\n'''
          new='''# The private Admin must use exactly the same locale selected for the dashboard.\n# Installer prompts remain PT-BR/English, but dashboard/Admin support all six\n# published dashboard locales without silent fallback to another language.\ncase "$UI_LANG" in\n  pt|pt-BR|pt_BR) ADMIN_UI_LANG='pt-BR' ;;\n  en|es|fr|de|it) ADMIN_UI_LANG="$UI_LANG" ;;\n  *) fail "$(say "Idioma do Admin não suportado: $UI_LANG" "Unsupported Admin language: $UI_LANG")" ;;\nesac\npython3 "$ROOT/control/build-admin.py" "$WORK/index.php" "$ADMIN_UI_LANG"\n'''
          if old not in s:
              raise SystemExit('module69 Admin language fallback block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Strengthen locale and Admin functional parity tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > tests/test-admin-i18n.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          fail(){ printf '[FAIL] %s\n' "$*" >&2; exit 1; }
          ok(){ printf '[OK] %s\n' "$*"; }
          command -v python3 >/dev/null 2>&1 || fail 'python3 is required'
          command -v php >/dev/null 2>&1 || fail 'php is required'
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          locales=(pt-BR en es fr de it)

          for locale in "${locales[@]}"; do
            target="$tmp/$locale.php"
            cp "$ROOT/control/current-production-admin.php" "$target"
            python3 "$ROOT/control/build-admin.py" "$target" "$locale"
            php -l "$target" >/dev/null
            grep -Fq "const CTRL_VER='1.5.1'" "$target" || fail "Admin 1.5.1 missing in $locale"
            for marker in health-status access-interlink-add access-interlink-delete radioid_api_search radioid_save; do
              grep -Fq "$marker" "$target" || fail "$marker missing in $locale"
            done
            ! grep -Eq 'Terminal XLXD|Terminal SSH|shell_exec\(\$_POST|passthru\(\$_POST' "$target" || fail "terminal marker leaked in $locale"
          done

          grep -Fq 'Acesso restrito' "$tmp/pt-BR.php" || fail 'Portuguese login marker missing'
          grep -Fq 'Restricted access' "$tmp/en.php" || fail 'English login marker missing'
          grep -Fq 'Acceso restringido' "$tmp/es.php" || fail 'Spanish login marker missing'
          grep -Fq 'Accès restreint' "$tmp/fr.php" || fail 'French login marker missing'
          grep -Fq 'Eingeschränkter Zugriff' "$tmp/de.php" || fail 'German login marker missing'
          grep -Fq 'Accesso riservato' "$tmp/it.php" || fail 'Italian login marker missing'

          python3 - "$ROOT" "$tmp" <<'PY'
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1]); tmp=Path(sys.argv[2])
          base=json.loads((root/'control/admin-en.json').read_text(encoding='utf-8'))
          for loc in ('es','fr','de','it'):
              cat=json.loads((root/f'control/admin-{loc}.json').read_text(encoding='utf-8'))
              if set(cat)!=set(base): raise SystemExit(f'{loc}: Admin catalog key mismatch')

          # Translation must never alter executable/functional HTML/PHP identifiers.
          attrs=('id','name')
          def structural(path):
              s=path.read_text(encoding='utf-8')
              out={a:sorted(set(re.findall(rf'\b{a}=["\']([^"\']+)["\']',s))) for a in attrs}
              out['actions']=sorted(set(re.findall(r"(?:action|op|cmd)\s*===?\s*['\"]([^'\"]+)['\"]",s)))
              out['helpers']=sorted(set(re.findall(r'(?:health-status|access-[a-z-]+|radioid[-_][a-z-]+|restart|listeners|logs|backups)',s)))
              return out
          reference=structural(tmp/'pt-BR.php')
          for loc in ('en','es','fr','de','it'):
              if structural(tmp/f'{loc}.php') != reference:
                  raise SystemExit(f'{loc}: Admin functional structure changed during translation')
          PY

          for bad in '/etc/legacy-control' '/var/lib/legacy-control' '/usr/local/sbin/legacy-control-'; do
            ! grep -Fq "$bad" "$tmp"/*.php || fail "production marker leaked into Admin: $bad"
          done
          ok 'Admin 1.5.1 has six locale-faithful interfaces with identical functional structure'

          for locale in "${locales[@]}"; do
            f="$(mktemp /tmp/xlx-admin-crawler.XXXXXX.php)"
            cp "$ROOT/control/current-production-admin.php" "$f"
            python3 "$ROOT/control/build-admin.py" "$f" "$locale"
            grep -Fq 'googlebot|bingbot' "$f" || fail "crawler protection missing in $locale"
            rm -f "$f"
          done
          SH
          chmod +x tests/test-admin-i18n.sh

          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test-install-flow.sh')
          s=p.read_text(encoding='utf-8')
          marker="ADMIN_LANGUAGE_PARITY_CONTRACT=OK"
          if marker not in s:
              s += r'''
          echo "[admin/dashboard locale parity]"
          grep -Fq "en|es|fr|de|it) ADMIN_UI_LANG=\"\$UI_LANG\"" "$ROOT/modules/69-admin-page.sh" || { echo 'Admin does not inherit dashboard locale' >&2; exit 1; }
          for loc in es fr de it; do
            test -s "$ROOT/control/admin-$loc.json" || { echo "missing Admin locale catalog: $loc" >&2; exit 1; }
          done
          echo "ADMIN_LANGUAGE_PARITY_CONTRACT=OK"
          '''
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate all six languages and Admin functions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool control/admin-en.json >/dev/null
          for loc in es fr de it; do python3 -m json.tool "control/admin-$loc.json" >/dev/null; done
          python3 -m py_compile control/build-admin.py
          bash -n modules/69-admin-page.sh tests/test-admin-i18n.sh tests/test-install-flow.sh
          bash tests/test-admin-i18n.sh
          bash tests/test-dashboard-i18n.sh
          bash tests/test-control-functional.sh
          bash tests/run-all.sh
          git diff --check

      - name: Publish six-locale Admin parity and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-admin-six-locales.yml
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add control/build-admin.py control/admin-es.json control/admin-fr.json control/admin-de.json control/admin-it.json modules/69-admin-page.sh tests/test-admin-i18n.sh tests/test-install-flow.sh .github/workflows/one-shot-admin-six-locales.yml
          git commit -m 'Keep Admin language faithful to all dashboard locales'
          git push origin HEAD:main
