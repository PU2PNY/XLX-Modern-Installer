name: 2PNY OS Alpha Image Build

on:
  push:
    branches: [ 2pny-os-build ]
    paths:
      - '2pny-os/**'
      - '.github/workflows/2pny-os-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore 2PNY source
        run: bash 2pny-os/bootstrap.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils util-linux rsync dosfstools e2fsprogs file

      - name: Validate 2PNY source
        run: cd 2pny-os && ./builder/validate-source.sh

      - name: Build 2PNY Raspberry Pi image
        run: cd 2pny-os && sudo -E VERSION=0.1.1-alpha ./builder/build-image.sh

      - name: Verify checksum output
        run: cat 2pny-os/dist/*.sha256

      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: 2PNY-OS-0.1.1-alpha-arm64
          path: |
            2pny-os/dist/*.img.xz
            2pny-os/dist/*.sha256
            2pny-os/dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
