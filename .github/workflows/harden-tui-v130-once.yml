name: Harden Textual bootstrap v1.3.0 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harden-tui-v130-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_tui_bootstrap_v130.py
      - name: Validate shell
        run: bash -n install.sh
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh
          git diff --cached --check
          git commit -m 'fix: harden Textual bootstrap on clean Debian 12'
          git push origin main
