name: XLX Modern Installer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "php -l $file"
            php -l "$file" >/dev/null
          done < <(find dashboard extras -type f -name '*.php' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find dashboard/assets extras -type f -name '*.js' -print0)

      - name: Validate translation catalogs
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
            $base = require "dashboard/i18n/locales/pt-BR.php";
            foreach (["en","es","fr","de","it"] as $locale) {
                $messages = require "dashboard/i18n/locales/{$locale}.php";
                $missing = array_diff_key($base, $messages);
                if ($missing) {
                    fwrite(STDERR, $locale . " missing: " . implode(", ", array_keys($missing)) . PHP_EOL);
                    exit(1);
                }
                echo $locale . ": " . count($messages) . " keys OK" . PHP_EOL;
            }
          '

      - name: Test multilingual generic dashboard builds
        shell: bash
        run: |
          set -Eeuo pipefail
          for locale in pt-BR en es fr de it; do
            target="$(mktemp -d)"
            cp -a dashboard/. "$target/"
            mkdir -p "$target/config"
            cat > "$target/config/site.php" <<'PHP'
          <?php
          declare(strict_types=1);
          return [
            'reflector' => [
              'name' => 'XLX999',
              'title' => 'XLX999 Community',
              'description' => 'Test reflector',
              'sysop_callsign' => 'N0CALL',
              'location' => 'Test City',
              'country' => 'Test Country',
              'domain' => 'xlx999.example.invalid',
              'contact_email' => 'noreply@example.invalid',
            ],
            'radio' => [
              'reflector_number' => '999',
              'reflector_short_number' => '999',
              'ysf_id' => '99999',
              'dmr_tg' => '4999',
            ],
          ];
          PHP
            php "$target/i18n/build.php" "$target" "$locale"
            php "$target/install/render-placeholders.php" "$target"
            php "$target/install/render-template.php" "$target"
            test -s "$target/config/i18n-build-report.json"
            ! grep -REn '\{\{[A-Z0-9_]+\}\}' "$target/index.php" "$target/assets/app.js" "$target/config.php"
            grep -F 'xlx999.example.invalid' "$target/index.php"
            grep -F 'XLX999-D / XRF999-D' "$target/config.php"
            grep -F "'server_name' => 'XLX999 Community'" "$target/config.php"
            ! grep -F 'BR-XLX999' "$target/index.php"
            ! grep -F 'XLX999 Brasil' "$target/index.php" "$target/config.php" "$target/assets/app.js"
            if [ "$locale" = en ]; then
              grep -F 'Activity from the last 24 hours' "$target/index.php"
              grep -F 'Up to 40 callsigns' "$target/index.php"
              grep -F 'Install XLX999' "$target/index.php"
              grep -F 'XLX999 — Live D-STAR, DMR and C4FM dashboard' "$target/index.php"
              ! grep -F 'Atividade das últimas 24 horas' "$target/index.php"
              ! grep -F 'Até 40 indicativos' "$target/index.php"
              ! grep -F 'Instalar XLX999' "$target/index.php"
            fi
            while IFS= read -r -d '' file; do
              php -l "$file" >/dev/null
            done < <(find "$target" -type f -name '*.php' -print0)
            rm -rf "$target"
          done

      - name: Test persistent callsign directory
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          main_db="$work/users.db"
          override_db="$work/state/overrides.db"
          sqlite3 "$main_db" <<'SQL'
          CREATE TABLE users(callsign TEXT PRIMARY KEY,name TEXT,city_state TEXT);
          INSERT INTO users VALUES('PU2OLD','Old Name','Old City');
          INSERT INTO users VALUES('PU2NEW','Base New Name','Base City');
          SQL
          sudo env XLX_USERS_DB="$main_db" XLX_OVERRIDE_DB="$override_db" XLX_BACKUP_ROOT="$work/backups" bash tools/xlx-user-directory.sh init
          sudo env XLX_USERS_DB="$main_db" XLX_OVERRIDE_DB="$override_db" XLX_BACKUP_ROOT="$work/backups" bash tools/xlx-user-directory.sh set PU2NEW 'Updated Name' 'Updated City'
          sudo env XLX_USERS_DB="$main_db" XLX_OVERRIDE_DB="$override_db" XLX_BACKUP_ROOT="$work/backups" bash tools/xlx-user-directory.sh alias PU2OLD PU2NEW
          output="$(sudo env XLX_USERS_DB="$main_db" XLX_OVERRIDE_DB="$override_db" XLX_BACKUP_ROOT="$work/backups" bash tools/xlx-user-directory.sh lookup PU2OLD)"
          grep -F 'override|PU2NEW|Updated Name|Updated City' <<<"$output"
          sudo env XLX_USERS_DB="$main_db" XLX_OVERRIDE_DB="$override_db" XLX_BACKUP_ROOT="$work/backups" bash tools/xlx-user-directory.sh check
          test "$(sudo sqlite3 "$override_db" 'PRAGMA integrity_check;')" = ok

      - name: Test generic certificate install
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          target="$work/dashboard"
          data="$work/cert-data"
          conf="$work/cert-conf"
          cp -a dashboard "$target"
          mkdir -p "$target/config"
          cat > "$target/config/site.php" <<'PHP'
          <?php
          declare(strict_types=1);
          return [
            'reflector'=>[
              'name'=>'XLX999','title'=>'XLX999 Community','description'=>'Test reflector',
              'sysop_callsign'=>'N0CALL','location'=>'Lisbon','country'=>'Portugal',
              'domain'=>'xlx999.example.invalid','contact_email'=>'noreply@example.invalid',
            ],
            'radio'=>['reflector_number'=>'999','reflector_short_number'=>'999','ysf_id'=>'99999','dmr_tg'=>'4999'],
            'locale'=>['default'=>'en'],
          ];
          PHP
          sudo env XLX_DASHBOARD_DIR="$target" XLX_CERT_DATA_DIR="$data" XLX_CERT_CONF_DIR="$conf" XLX_CERT_KEY_FILE="$conf/hmac.key" XLX_CERT_SKIP_PACKAGES=1 XLX_TIMEZONE=Europe/Lisbon XLX_REFLECTOR_ANNIVERSARY=07-22 bash extras/certificados/install.sh
          sudo test -s "$target/certificado.php"
          sudo test -s "$target/certificado-validar.php"
          sudo test -s "$target/api/certificado.php"
          sudo test -s "$conf/hmac.key"
          sudo test -e "$data/emissoes.jsonl"
          sudo grep -F 'XLX_CERTIFICATE_MENU_V1' "$target/assets/app.js"
          sudo php -r '$c=require $argv[1]; if(($c["timezone"]??"")!=="Europe/Lisbon") exit(1); if(($c["certificates"]["anniversary"]??"")!=="07-22") exit(2);' "$target/config/site.php"
          sudo env XLX_CERT_DATA_DIR="$data" XLX_CERT_KEY_FILE="$conf/hmac.key" php -r 'require $argv[1]; $c=cert_current_campaign(new DateTimeImmutable("2026-08-09 12:00:00", new DateTimeZone("Europe/Lisbon"))); if(str_contains($c["title"],"Dia dos Pais")) exit(1); if(cert_reflector()["title"]!=="XLX999 Community") exit(2);' "$target/certificado-config.php"

      - name: Validate fresh-install wiring and runtime fallbacks
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'install-dashboard.sh" "$@"' modules/60-dashboard-modern.sh
          grep -F 'post-install.sh' modules/60-dashboard-modern.sh
          grep -F '65-callsign-directory.sh' modules/60-dashboard-modern.sh
          grep -F '66-certificates.sh' modules/60-dashboard-modern.sh
          grep -F -- '--lang=*)' dashboard/install/install-dashboard.sh
          grep -F '"--lang=$DASHBOARD_LANG"' install.sh
          grep -F '$ROOT/install/render-placeholders.php' dashboard/install/install-dashboard.sh
          grep -F '/var/cache/xlx-dashboard' dashboard/install/install-dashboard.sh
          grep -F '/var/cache/xlx-ham-weather' dashboard/install/install-dashboard.sh
          grep -F 'php-mbstring' modules/30-packages.sh
          grep -F "'source'=>'log_fallback'" dashboard/api/ranking-v2.php
          grep -F "'users_override_db'" dashboard/config.php
          grep -F 'user-directory.php' dashboard/api/status.php
          bash -n dashboard/install/post-install.sh
          bash -n tools/xlx-user-directory.sh
          bash -n extras/certificados/install.sh
          php -l dashboard/install/render-template.php >/dev/null
          php -l dashboard/install/render-placeholders.php >/dev/null
          php -l dashboard/api/ranking-v2.php >/dev/null
          php -l dashboard/api/user-directory.php >/dev/null
          php -l extras/certificados/api/certificado.php >/dev/null
          grep -F 'XLX_PROJECT_LINK_BUNDLE_V1' dashboard/install/post-install.sh

      - name: Validate optional APRS/D-PRS pin and source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F -- '--with-aprs-dprs' install.sh
          grep -F -- '--without-aprs-dprs' install.sh
          grep -F 'modules/67-aprs-dprs.sh' install.sh
          grep -F '771abaa0c1ea662f33f3fa0c4a59ec712b1e4fcb' modules/67-aprs-dprs.sh
          grep -F '0c5c26adbf9b54fe803e3cbaf2ddc17e4ba737f7c9f3b5606231b67c9a9403f9' modules/67-aprs-dprs.sh
          grep -F 'b4a0e8f1e1fec7e894cff4c61b18c5891122278ecf5f2f666e5398b361c808d4' modules/67-aprs-dprs.sh
          sudo bash modules/67-aprs-dprs.sh --check

      - name: Test safe dashboard updater dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          target="$work/dashboard"
          mkdir -p "$target/config"
          cp dashboard/index.php "$target/index.php"
          cat > "$target/config/site.php" <<'PHP'
          <?php
          declare(strict_types=1);
          return [
            'reflector'=>[
              'name'=>'XLX999','title'=>'XLX999 Community','description'=>'Test reflector',
              'sysop_callsign'=>'N0CALL','location'=>'Test City','country'=>'Test Country',
              'domain'=>'xlx999.example.invalid','contact_email'=>'noreply@example.invalid',
            ],
            'radio'=>['reflector_number'=>'999','reflector_short_number'=>'999','ysf_id'=>'99999','dmr_tg'=>'4999'],
            'locale'=>['default'=>'en'],
            'timezone'=>'UTC',
            'certificates'=>['enabled'=>true,'anniversary'=>''],
          ];
          PHP
          before="$(sha256sum "$target/index.php" | awk '{print $1}')"
          sudo bash update.sh --check --dashboard-dir="$target"
          after="$(sha256sum "$target/index.php" | awk '{print $1}')"
          test "$before" = "$after"
          test ! -e "$target/aprs-dprs/config.json"

      - name: Public-release audit
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/public-release-audit.sh
