name: One-shot Admin locale quality hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden-locales:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace machine-generated Admin catalogs with reviewed static catalogs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          blobs={
          'es':'',
          'fr':'',
          'de':'',
          'it':''
          }
          for locale,blob in blobs.items():
              Path(f'control/admin-{locale}.json').write_bytes(zlib.decompress(base64.b64decode(blob)))
          PY
      - name: Add permanent linguistic quality guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test-admin-i18n.sh')
          s=p.read_text(encoding='utf-8')
          marker='ADMIN_I18N_QUALITY=OK'
          if marker not in s:
              s += r'''

python3 - "$ROOT" <<'PYQ'
import json,sys
from pathlib import Path
root=Path(sys.argv[1])
expected={
 'es': {'ATENÇÃO':'ATENCIÓN','ATIVO':'ACTIVO','Adicionar novo cadastro':'Añadir nuevo registro','FALHA':'FALLO','FALHOU':'FALLÓ','NÃO HABILITADO':'NO HABILITADO','PENDENTE':'PENDIENTE','pipelines':'pipelines','timeouts observados nos últimos 15 minutos':'timeouts observados en los últimos 15 minutos'},
 'fr': {'ATENÇÃO':'ATTENTION','ATIVO':'ACTIF','Adicionar novo cadastro':'Ajouter un nouvel enregistrement','FALHA':'ÉCHEC','FALHOU':'ÉCHEC','NÃO HABILITADO':'NON ACTIVÉ','PENDENTE':'EN ATTENTE','OK':'OK','pipelines':'pipelines'},
 'de': {'ATENÇÃO':'ACHTUNG','ATIVO':'AKTIV','Adicionar novo cadastro':'Neuen Eintrag hinzufügen','FALHA':'FEHLER','FALHOU':'FEHLGESCHLAGEN','NÃO HABILITADO':'NICHT AKTIVIERT','PENDENTE':'AUSSTEHEND'},
 'it': {'ATENÇÃO':'ATTENZIONE','ATIVO':'ATTIVO','Adicionar novo cadastro':'Aggiungi nuovo record','FALHA':'ERRORE','FALHOU':'NON RIUSCITO','NÃO HABILITADO':'NON ABILITATO','PENDENTE':'IN ATTESA'}
}
for loc,checks in expected.items():
    data=json.loads((root/f'control/admin-{loc}.json').read_text(encoding='utf-8'))
    for key,value in checks.items():
        if data.get(key)!=value:
            raise SystemExit(f'{loc}: unexpected translation for {key!r}: {data.get(key)!r}')
    joined='\n'.join(data.values())
    for bad in ('ZXQ','&quot;','NO ENABLED','PARTIAL\n','WARNING\n','ACTIVE\n','Query official API','Query RadioID.net','oleoductos','Gardien de porte','FOI\n'):
        if bad in joined:
            raise SystemExit(f'{loc}: forbidden machine-translation artifact: {bad}')
    strong=data['Cria um novo <strong>users.db</strong> separado, valida a integridade e só então publica o arquivo pronto. Se falhar, mantém a base anterior.']
    if '<strong>users.db</strong>' not in strong:
        raise SystemExit(f'{loc}: users.db markup was not preserved')
    for value in data.values():
        if "'" in value or '"' in value or '\\' in value:
            raise SystemExit(f'{loc}: unsafe ASCII quote/backslash in replacement value: {value!r}')
print('ADMIN_I18N_QUALITY=OK')
PYQ
ok 'Admin locale catalogs passed linguistic quality guardrails'
'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate all locale and Admin functions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in control/admin-{es,fr,de,it}.json; do python3 -m json.tool "$f" >/dev/null; done
          bash tests/test-admin-i18n.sh
          bash tests/test-dashboard-i18n.sh
          bash tests/test-control-functional.sh
          bash tests/run-all.sh
          git diff --check
      - name: Publish reviewed catalogs
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add control/admin-es.json control/admin-fr.json control/admin-de.json control/admin-it.json tests/test-admin-i18n.sh
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Replace Admin machine translations with reviewed locale catalogs'
          git push origin HEAD:main
