name: Repair installer pin and publish v1.2.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v1214-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair pinned installer hash and version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'

          INSTALLER='vendor/pp5pk-installer/installer.sh'
          HASH="$(sha256sum "$INSTALLER" | awk '{print $1}')"
          test -n "$HASH"

          python3 - "$HASH" <<'PY'
          import pathlib, re, sys
          h = sys.argv[1]
          p = pathlib.Path('install.sh')
          s = p.read_text()
          s2, n = re.subn(r'readonly EXPECTED_INSTALLER_SHA256="[0-9a-f]{64}"', f'readonly EXPECTED_INSTALLER_SHA256="{h}"', s, count=1)
          if n != 1:
              raise SystemExit('EXPECTED_INSTALLER_SHA256 replacement count != 1')
          p.write_text(s2)

          pathlib.Path('VERSION').write_text('1.2.14\n')
          for name in ('README.md', 'README.en.md', 'README.pt-BR.md'):
              q = pathlib.Path(name)
              if q.exists():
                  t = q.read_text()
                  t = t.replace('v1.2.13', 'v1.2.14')
                  q.write_text(t)
          PY

          bash -n install.sh
          bash -n "$INSTALLER"
          grep -Fq 'XLX MODERN INSTALLER — PU2PNY' "$INSTALLER"
          grep -Fq '(e.g., xlx026.net)' "$INSTALLER"
          grep -Fq 'XLXD upstream: LX3JL / LX1IQ | Installer base: Daniel K. — PP5PK' "$INSTALLER"

          EXPECTED="$(sed -n 's/^readonly EXPECTED_INSTALLER_SHA256="\([0-9a-f]\{64\}\)"$/\1/p' install.sh)"
          test "$EXPECTED" = "$HASH"
          test "$(cat VERSION)" = '1.2.14'
          git diff --check

          git rm .github/workflows/repair-v1214-once.yml
          git add install.sh VERSION README.md README.en.md README.pt-BR.md
          git commit -m 'fix: synchronize installer integrity pin v1.2.14'
          TARGET="$(git rev-parse HEAD)"
          git push origin main

          git tag -a v1.2.14 "$TARGET" -m 'XLX Modern Installer v1.2.14'
          git push origin v1.2.14
          gh release create v1.2.14 \
            --target "$TARGET" \
            --title 'XLX Modern Installer v1.2.14' \
            --latest \
            --notes 'Integrity-pin repair following the XLX Modern identity update. Synchronizes the pinned SHA-256 with the reviewed vendored installer, keeps XLX026/xlx026.net as the production reference examples, and preserves upstream attribution to XLXD LX3JL/LX1IQ and installer-base author Daniel K. PP5PK.'
