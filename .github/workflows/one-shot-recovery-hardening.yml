name: One-shot recovery hardening

on:
  push:
    paths:
      - .github/workflows/one-shot-recovery-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch HTTPS backoff and recovery source-integrity guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dash = Path('dashboard/install/install-dashboard.sh')
          s = dash.read_text()
          marker = 'if [ "$ENABLE_HTTPS" = "yes" ]; then\n'
          if marker not in s:
              raise SystemExit('HTTPS entry marker missing')
          helper = r'''https_backoff_active() {
              local retry_raw retry_epoch now_epoch
              HTTPS_PENDING_RETRY_AT=""
              [[ -f "$HTTPS_STATUS_FILE" ]] || return 1
              retry_raw="$(sed -n 's/^retry_at_utc=//p' "$HTTPS_STATUS_FILE" | tail -n 1)"
              [[ -n "$retry_raw" ]] || return 1
              retry_epoch="$(date -u -d "$retry_raw" '+%s' 2>/dev/null || true)"
              now_epoch="$(date -u '+%s')"
              [[ "$retry_epoch" =~ ^[0-9]+$ ]] || return 1
              (( now_epoch < retry_epoch )) || return 1
              HTTPS_PENDING_RETRY_AT="$retry_raw"
              return 0
          }

          '''
          if 'https_backoff_active() {' not in s:
              s = s.replace(marker, helper + marker, 1)

          entry = s.index(marker)
          old = '    else\n        CERTBOT_LOG="$(mktemp /tmp/xlx-modern-certbot.XXXXXX.log)"\n'
          pos = s.find(old, entry)
          if pos < 0:
              if 'elif https_backoff_active; then' not in s:
                  raise SystemExit('Certbot branch marker missing')
          else:
              new = '''    elif https_backoff_active; then
                  printf '[INFO] HTTPS retry already scheduled for %s; skipping Certbot until the backoff expires.\\n' "$HTTPS_PENDING_RETRY_AT" >&2
                  printf '[INFO] Nova tentativa HTTPS já agendada para %s; Certbot não será executado antes do fim do bloqueio.\\n' "$HTTPS_PENDING_RETRY_AT" >&2
                  if [[ "${XLX_HTTPS_RETRY_TEST_MODE:-0}" != "1" ]] \\
                      && systemctl list-unit-files xlx-modern-https-retry.timer --no-legend 2>/dev/null | grep -q .; then
                      systemctl enable --now xlx-modern-https-retry.timer >/dev/null 2>&1 || true
                  fi
              else
                  CERTBOT_LOG="$(mktemp /tmp/xlx-modern-certbot.XXXXXX.log)"
          '''
              s = s[:pos] + new + s[pos + len(old):]
          dash.write_text(s)

          test = Path('tests/test-https-rate-limit.sh')
          t = test.read_text()
          anchor = "grep -Fq 'xlx-modern-https-retry.timer' \"$ROOT/dashboard/install/install-dashboard.sh\"\n"
          additions = """grep -Fq 'https_backoff_active() {' \"$ROOT/dashboard/install/install-dashboard.sh\"\ngrep -Fq 'elif https_backoff_active; then' \"$ROOT/dashboard/install/install-dashboard.sh\"\ngrep -Fq 'skipping Certbot until the backoff expires' \"$ROOT/dashboard/install/install-dashboard.sh\"\ngrep -Fq 'now_epoch < retry_epoch' \"$ROOT/dashboard/install/install-dashboard.sh\"\n"""
          if 'skipping Certbot until the backoff expires' not in t:
              if anchor not in t:
                  raise SystemExit('HTTPS test anchor missing')
              t = t.replace(anchor, anchor + additions, 1)
          test.write_text(t)

          recovery = Path('recover-incomplete-install.sh')
          r = recovery.read_text()
          before_anchor = "exec > >(tee -a \"$LOG\") 2>&1\n\n"
          before_block = '''repo_diff_hash(){
            git -C "$ROOT" diff --no-ext-diff --binary HEAD 2>/dev/null | sha256sum | awk '{print $1}'
          }
          REPO_DIFF_HASH_BEFORE="$(repo_diff_hash)"
          REPO_TRACKED_STATUS_BEFORE="$(git -C "$ROOT" status --porcelain --untracked-files=no 2>/dev/null || true)"

          '''
          if 'REPO_DIFF_HASH_BEFORE=' not in r:
              if before_anchor not in r:
                  raise SystemExit('Recovery preflight anchor missing')
              r = r.replace(before_anchor, before_anchor + before_block, 1)

          end_anchor = "printf '\\nRECOVERY_STATUS=OK\\n'\n"
          end_block = '''REPO_DIFF_HASH_AFTER="$(repo_diff_hash)"
          REPO_TRACKED_STATUS_AFTER="$(git -C "$ROOT" status --porcelain --untracked-files=no 2>/dev/null || true)"
          if [[ "$REPO_DIFF_HASH_AFTER" != "$REPO_DIFF_HASH_BEFORE" || "$REPO_TRACKED_STATUS_AFTER" != "$REPO_TRACKED_STATUS_BEFORE" ]]; then
            printf '%s\\n' "$REPO_TRACKED_STATUS_AFTER" >&2
            fail 'A recuperação alterou arquivos rastreados do próprio instalador; execução interrompida para preservar a árvore Git.'
          fi
          ok 'A recuperação não alterou o código-fonte rastreado do instalador; alterações locais preexistentes foram preservadas.'

          '''
          if 'REPO_DIFF_HASH_AFTER=' not in r:
              if end_anchor not in r:
                  raise SystemExit('Recovery final anchor missing')
              r = r.replace(end_anchor, end_block + end_anchor, 1)
          recovery.write_text(r)

          edge = Path('tests/test-web-edge-handoff.sh')
          e = edge.read_text()
          edge_anchor = "MODULE=\"$ROOT/modules/60-dashboard-modern.sh\"\n"
          if 'RECOVERY="$ROOT/recover-incomplete-install.sh"' not in e:
              e = e.replace(edge_anchor, edge_anchor + 'RECOVERY="$ROOT/recover-incomplete-install.sh"\n', 1)
          final_anchor = "printf 'OK | partial-install recovery serializes Apache/Nginx port ownership and restores Nginx on failure\\n'\n"
          checks = '''for marker in \\
            'REPO_DIFF_HASH_BEFORE=' \\
            'REPO_DIFF_HASH_AFTER=' \\
            'git -C "$ROOT" diff --no-ext-diff --binary HEAD' \\
            'A recuperação não alterou o código-fonte rastreado do instalador'; do
            grep -Fq "$marker" "$RECOVERY" || fail "missing recovery source-integrity marker: $marker"
          done

          '''
          if 'missing recovery source-integrity marker' not in e:
              if final_anchor not in e:
                  raise SystemExit('Web-edge test final anchor missing')
              e = e.replace(final_anchor, checks + final_anchor, 1)
          edge.write_text(e)
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n dashboard/install/install-dashboard.sh
          bash -n recover-incomplete-install.sh
          bash tests/test-https-rate-limit.sh
          bash tests/test-web-edge-handoff.sh
          bash tests/run-all.sh
          git diff --check

      - name: Publish repair and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-recovery-hardening.yml
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add dashboard/install/install-dashboard.sh recover-incomplete-install.sh tests/test-https-rate-limit.sh tests/test-web-edge-handoff.sh .github/workflows/one-shot-recovery-hardening.yml
          git commit -m 'Respect HTTPS backoff and preserve recovery source tree'
          git push origin HEAD:main
