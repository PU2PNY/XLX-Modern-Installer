name: XLX026 Control RadioID V2

on:
  pull_request:
    paths:
      - 'control/xlx026-control-index-radioid-v2.php'
      - 'control/xlx026-control-helper-radioid-v2'
      - 'ops/root/xlx026-control-radioid-v2.sh'
      - '.github/workflows/xlx026-control-radioid-v2.yml'
  push:
    branches: [ main ]
    paths:
      - 'control/xlx026-control-index-radioid-v2.php'
      - 'control/xlx026-control-helper-radioid-v2'
      - 'ops/root/xlx026-control-radioid-v2.sh'
      - '.github/workflows/xlx026-control-radioid-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and security invariants
        run: |
          set -Eeuo pipefail
          bash -n control/xlx026-control-helper-radioid-v2
          bash -n ops/root/xlx026-control-radioid-v2.sh
          php -l control/xlx026-control-index-radioid-v2.php
          for needle in "const CTRL_VER='1.1.0'" 'Indicativos &amp; RadioID'; do
            grep -Fq "$needle" control/xlx026-control-index-radioid-v2.php || { echo "MISSING INDEX INVARIANT: $needle"; exit 1; }
          done
          for action in radioid-status radioid-search radioid-save radioid-delete radioid-refresh radioid-check; do
            grep -Fq "$action" control/xlx026-control-helper-radioid-v2 || { echo "MISSING HELPER ACTION: $action"; exit 1; }
          done
          if grep -En 'eval |bash -c|sh -c|NOPASSWD:[[:space:]]*ALL|shell_exec\(|passthru\(|proc_open\(|popen\(' control/xlx026-control-index-radioid-v2.php control/xlx026-control-helper-radioid-v2; then
            echo 'FORBIDDEN SECURITY PATTERN FOUND IN RUNTIME CODE'
            exit 1
          fi

      - name: Prepare temporary RadioID database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 php-cli php-sqlite3
          sudo install -d -m 0777 /xlxd/users_db
          sudo tee /xlxd/users_db/users_base.csv >/dev/null <<'CSV'
          DMRID,CALLSIGN,FIRSTNAME,LASTNAME,CITY,STATE,COUNTRY
          7240001,PY2ABC,Ana,Silva,Sao Paulo,SP,Brazil
          7240002,PU2XYZ,Bruno,Souza,Santa Isabel,SP,Brazil
          3100001,K1AAA,John,Doe,Boston,MA,USA
          CSV
          sudo tee /xlxd/users_db/reflector_user_manager.sh >/dev/null <<'SH'
          #!/bin/bash
          exit 0
          SH
          sudo chmod 755 /xlxd/users_db/reflector_user_manager.sh
          sudo tee /xlxd/users_db/create_user_db.php >/dev/null <<'PHP'
          <?php
          $csv=__DIR__.'/users_base.csv';
          $db=__DIR__.'/users.db';
          @unlink($db);
          $pdo=new PDO('sqlite:'.$db);
          $pdo->exec('CREATE TABLE users (dmrid TEXT,callsign TEXT,first_name TEXT,last_name TEXT,city TEXT,state TEXT,country TEXT)');
          $fh=fopen($csv,'r'); fgetcsv($fh);
          $st=$pdo->prepare('INSERT INTO users VALUES (?,?,?,?,?,?,?)');
          while(($r=fgetcsv($fh))!==false){ if(count($r)>=7)$st->execute(array_slice($r,0,7)); }
          fclose($fh);
          PHP
          sudo php /xlxd/users_db/create_user_db.php
          sudo sqlite3 /xlxd/users_db/users.db 'PRAGMA integrity_check;'

      - name: RadioID status and search
        run: |
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-status > /tmp/status.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/status.json'))
          assert x['ok'] is True and x['records']==3 and x['integrity']=='ok'
          PY
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-search callsign PY2 > /tmp/search.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/search.json'))
          assert x['count']==1 and x['rows'][0]['callsign']=='PY2ABC'
          PY
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-search city 'Santa*' > /tmp/search-city.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/search-city.json'))
          assert x['count']==1 and x['rows'][0]['callsign']=='PU2XYZ'
          PY

      - name: RadioID edit add delete and rebuild
        run: |
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-save 7240001 PY2ABC 7240001 PY2ABC Ana Silva Campinas SP Brazil > /tmp/edit.json
          grep -Fq 'PY2ABC,Ana,Silva,Campinas,SP,Brazil' /xlxd/users_db/users_base.csv
          test "$(sudo sqlite3 /xlxd/users_db/users.db "select city from users where callsign='PY2ABC';")" = 'Campinas'

          sudo bash control/xlx026-control-helper-radioid-v2 radioid-save '' '' 7249999 PU2NEW Carlos Lima Aruja SP Brazil > /tmp/add.json
          grep -Fq '7249999,PU2NEW,Carlos,Lima,Aruja,SP,Brazil' /xlxd/users_db/users_base.csv
          test "$(sudo sqlite3 /xlxd/users_db/users.db "select count(*) from users where callsign='PU2NEW';")" = '1'

          sudo bash control/xlx026-control-helper-radioid-v2 radioid-delete 7249999 PU2NEW > /tmp/delete.json
          ! grep -Fq 'PU2NEW' /xlxd/users_db/users_base.csv
          test "$(sudo sqlite3 /xlxd/users_db/users.db "select count(*) from users where callsign='PU2NEW';")" = '0'

          sudo bash control/xlx026-control-helper-radioid-v2 radioid-refresh > /tmp/refresh.json
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-check > /tmp/check.json
          test "$(sudo sqlite3 /xlxd/users_db/users.db 'PRAGMA integrity_check;')" = 'ok'
          sudo find /root/backups-xlx026/radioid-control -type f -name 'users_base.csv.before' | grep -q .

      - name: Duplicate protections
        run: |
          set +e
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-save '' '' 7240002 PU2DUP Test User TestCity SP Brazil >/tmp/dup-dmr.out 2>&1
          rc_dmr=$?
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-save 7240001 PY2ABC 7240001 PU2XYZ Ana Silva Campinas SP Brazil >/tmp/dup-call.out 2>&1
          rc_call=$?
          set -e
          test "$rc_dmr" -ne 0
          test "$rc_call" -ne 0
          grep -Fq 'PU2XYZ' /xlxd/users_db/users_base.csv
          grep -Fq '7240001,PY2ABC,Ana,Silva,Campinas,SP,Brazil' /xlxd/users_db/users_base.csv
          test "$(sudo sqlite3 /xlxd/users_db/users.db "select count(*) from users where dmrid='7240002';")" = '1'
          test "$(sudo sqlite3 /xlxd/users_db/users.db "select count(*) from users where callsign='PU2XYZ';")" = '1'

      - name: Forced rebuild failure restores CSV and SQLite
        run: |
          csv_before="$(sha256sum /xlxd/users_db/users_base.csv | awk '{print $1}')"
          db_before="$(sha256sum /xlxd/users_db/users.db | awk '{print $1}')"
          sudo cp -a /xlxd/users_db/create_user_db.php /tmp/create_user_db.php.good
          sudo tee /xlxd/users_db/create_user_db.php >/dev/null <<'PHP'
          <?php
          @unlink(__DIR__.'/users.db');
          file_put_contents(__DIR__.'/users.db','BROKEN');
          exit(42);
          PHP
          set +e
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-save 7240001 PY2ABC 7240001 PY2ABC Ana Silva Santos SP Brazil >/tmp/rebuild-fail.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(sha256sum /xlxd/users_db/users_base.csv | awk '{print $1}')" = "$csv_before"
          test "$(sha256sum /xlxd/users_db/users.db | awk '{print $1}')" = "$db_before"
          test "$(sudo sqlite3 /xlxd/users_db/users.db 'PRAGMA integrity_check;')" = 'ok'
          sudo find /root/backups-xlx026/radioid-control -type f -name RESULT -exec grep -l 'reason=rebuild_failed' {} + | grep -q .
          sudo cp -a /tmp/create_user_db.php.good /xlxd/users_db/create_user_db.php
          sudo bash control/xlx026-control-helper-radioid-v2 radioid-check >/tmp/check-after-rollback.json

      - name: Production updater invariants
        run: |
          grep -Fq 'OLD_INDEX_BLOB="c615cb8068d5d9ce900fc193ea771642f2206e94"' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq 'OLD_HELPER_BLOB="dc78219b8a8a6fdfe6a364b2d422b5a5340e735c"' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq 'SOURCE_COMMIT="16cef879e18897df7c25eaaa99cce7a6f3ae6629"' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq 'NEW_INDEX_BLOB="a617b6e359620834ffefc9d71c2632949aa6fe70"' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq 'NEW_HELPER_BLOB="a40de58d5359d1d2f4250a22fcd884cde59f6477"' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq "! grep -Eq 'eval |bash -c|sh -c|NOPASSWD:[[:space:]]*ALL'" ops/root/xlx026-control-radioid-v2.sh
          ! grep -Eq 'NOPASSWD:[[:space:]]*ALL' ops/root/xlx026-control-radioid-v2.sh
          grep -Fq "grep -Fxiq 'mbstring'" ops/root/xlx026-control-radioid-v2.sh
          grep -Fq 'XLXD não foi reiniciado.' ops/root/xlx026-control-radioid-v2.sh
