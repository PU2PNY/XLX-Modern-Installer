name: Refresh production documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-production-refresh.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README and aligned documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c "import base64;exec(base64.b64decode(''))"
          git diff --check
          grep -Fq 'xlx026.net' README.md
          grep -Fq 'módulo B' README.pt-BR.md
          grep -Fq 'Mais transmissões' dashboard/ranking-v2-view.php
          grep -Fq '"module":"B"' modules/67-aprs-dprs.sh
          grep -Fq '"tx_enabled":True' modules/67-aprs-dprs.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md README.pt-BR.md docs/FEATURES.md docs/APRS-DPRS.md
          git commit -m 'docs: describe XLX026 production feature set'
          git push origin HEAD:main
