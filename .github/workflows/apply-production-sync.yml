name: Apply validated production core sync

on:
  push:
    branches: [sync/production-20260813]
    paths: [.sync-payload/APPLY]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/production-20260813
          fetch-depth: 0

      - name: Reconstruct and validate overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .sync-payload/core-overlay.b64.part* | base64 -d > /tmp/core-overlay.tar.gz
          echo 'bd8284e45fcd8d6937dcd240dff13eab3b518b683eb0afae7ebda79c79e98a3e  /tmp/core-overlay.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          p='/tmp/core-overlay.tar.gz'
          with tarfile.open(p,'r:gz') as tf:
              for m in tf.getmembers():
                  parts=[x for x in m.name.split('/') if x not in ('','.')]
                  if m.name.startswith('/') or any(x == '..' for x in parts):
                      raise SystemExit(f'unsafe path: {m.name}')
                  if m.issym() or m.islnk():
                      raise SystemExit(f'links are not allowed: {m.name}')
          PY
          mkdir -p /tmp/core-overlay
          tar -xzf /tmp/core-overlay.tar.gz -C /tmp/core-overlay

      - name: Apply overlay without deleting universal files
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a /tmp/core-overlay/ dashboard/

      - name: Merge live-page structure into universal index
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('dashboard/index.php')
          s=p.read_text(encoding='utf-8')

          old="$authorizedPage = in_array($page, ['ao-vivo','modulos','conectados','ranking'], true);"
          new=old+"\n$aprsDprsInstalled = is_file(__DIR__ . '/aprs-dprs/index.php');"
          if old not in s or '$aprsDprsInstalled' in s:
              raise SystemExit('unexpected authorized-page anchor')
          s=s.replace(old,new,1)

          old="function page_url(string $p): string { return '?page=' . rawurlencode($p); }"
          new="function page_url(string $p): string { if ($p === 'aprs-dprs') return '/aprs-dprs/'; return '?page=' . rawurlencode($p); }"
          if old not in s:
              raise SystemExit('unexpected page_url anchor')
          s=s.replace(old,new,1)

          old='function render_nav(string $page): string {'
          new='function render_nav(string $page, bool $aprsDprsInstalled = false): string {'
          if old not in s:
              raise SystemExit('unexpected render_nav signature')
          s=s.replace(old,new,1)

          old="  return $html;\n}\n$seo = ["
          new="  if ($aprsDprsInstalled) { $html .= '<a href=\"/aprs-dprs/\">APRS / D-PRS</a>'; }\n  return $html;\n}\n$seo = ["
          if old not in s:
              raise SystemExit('unexpected render_nav return anchor')
          s=s.replace(old,new,1)

          old='<?=render_nav($page)?>'
          new='<?=render_nav($page, $aprsDprsInstalled)?>'
          if old not in s:
              raise SystemExit('unexpected nav call anchor')
          s=s.replace(old,new,1)

          css_anchor='<link rel="stylesheet" href="assets/ao-vivo-gif-anchor-v12.css?v=1">'
          css_extra='''<link rel="stylesheet" href="assets/ao-vivo-gif-anchor-v12.css?v=1">
<link rel="stylesheet" href="assets/ao-vivo-cirurgico-v1.css?v=1">
<link rel="stylesheet" href="assets/ao-vivo-boxes-v2.css?v=1">
<link rel="stylesheet" href="assets/ao-vivo-boxes-v31-radar.css?v=1">
<link rel="stylesheet" href="assets/atividade-24h-conectados-v1.css?v=1">'''
          if css_anchor not in s:
              raise SystemExit('unexpected ao-vivo CSS anchor')
          s=s.replace(css_anchor,css_extra,1)

          old='''<aside class="live-widget"><div class="widget-heading"><div><p class="eyebrow">MONITOR AO VIVO</p><h2>Transmissões</h2></div><span id="widgetCount">Standby</span></div><div id="moduleGrid" class="module-grid widget-grid"></div><div id="opsWidget" class="ops-widget"><span class="status-dot"></span><div><b>Servidor operacional</b><small id="serverLine">Lendo estado...</small></div><div class="ops-numbers"><span><b id="headerConnected">0</b> conectados</span><span><b id="headerActive">0</b> TX ativa</span></div></div></aside>'''
          new='''<aside class="live-widget"><div class="widget-heading"><div><p class="eyebrow">MONITOR AO VIVO</p><h2>Transmissões</h2></div><span id="widgetCount">Standby</span></div><div class="live-summary-bar" aria-label="Resumo do monitor ao vivo"><span class="live-summary-item live-summary-connected"><b id="headerConnected">0</b><small>conectados</small></span><span class="live-summary-item live-summary-active"><b id="headerActive">0</b><small>TX ativa</small></span></div><div id="moduleGrid" class="module-grid widget-grid"></div></aside>'''
          if old not in s:
              raise SystemExit('unexpected live-widget markup anchor')
          s=s.replace(old,new,1)

          old='<h2>Atividade das últimas 24 horas</h2>'
          new='<h2 class="history-title-connected-size">Atividade das últimas 24 horas</h2>'
          if old not in s:
              raise SystemExit('unexpected history title anchor')
          s=s.replace(old,new,1)

          s,n=re.subn(r'assets/app\.js\?v=[^"\']+', 'assets/app.js?v=20260813_v103', s)
          if n != 1:
              raise SystemExit(f'unexpected app.js version replacements: {n}')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate synchronized dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find dashboard -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find dashboard/assets -type f -name '*.js' -print0)
          bash -n install.sh
          bash -n update.sh
          bash -n modules/67-aprs-dprs.sh
          ! grep -REn 'xlx026\.net|/var/cache/xlx026|XLX026 Brasil|YSF 72426|TG 4003|82\.152\.175\.30' \
            dashboard/api/common.php dashboard/api/ham-weather.php dashboard/api/live.php dashboard/api/mtr.php \
            dashboard/assets/app.js dashboard/assets/install-app.js dashboard/llms.txt dashboard/robots.txt dashboard/site.webmanifest
          grep -F 'CONNECTED_COUNT_VOICE_V103_NO_TX' dashboard/assets/app.js
          grep -F "const reflector='{{REFLECTOR_NAME}}';" dashboard/assets/app.js
          grep -F 'live-summary-bar' dashboard/index.php
          grep -F '/aprs-dprs/' dashboard/index.php
          git diff --check

      - name: Commit synchronized core and remove transfer payload
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          rm -rf .sync-payload
          rm -f .github/workflows/apply-production-sync.yml
          git add -A
          git diff --cached --check
          git commit -m 'Sync validated production core into universal dashboard'
          git push origin HEAD:sync/production-20260813
