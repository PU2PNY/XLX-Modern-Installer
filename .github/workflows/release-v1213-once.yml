name: Publish v1.2.13 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1213-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release target
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='09abcd6f99044228008735efc4d067628ff01d4b'
          git cat-file -e "$TARGET^{commit}"
          test "$(git show "$TARGET:VERSION")" = '1.2.13'
          git show "$TARGET:vendor/pp5pk-installer/installer.sh" | grep -Fq 'XLX MODERN INSTALLER — PU2PNY'
          git show "$TARGET:vendor/pp5pk-installer/installer.sh" | grep -Fq '(e.g., xlx026.net)'
          git show "$TARGET:vendor/pp5pk-installer/installer.sh" | grep -Fq 'XLXD upstream: LX3JL / LX1IQ | Installer base: Daniel K. — PP5PK'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='09abcd6f99044228008735efc4d067628ff01d4b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git rev-parse 'refs/tags/v1.2.13' >/dev/null 2>&1; then
            test "$(git rev-list -n1 v1.2.13)" = "$TARGET"
          else
            git tag -a v1.2.13 "$TARGET" -m 'XLX Modern Installer v1.2.13'
            git push origin v1.2.13
          fi

          if gh release view v1.2.13 >/dev/null 2>&1; then
            gh release edit v1.2.13 --latest
          else
            gh release create v1.2.13 \
              --target "$TARGET" \
              --title 'XLX Modern Installer v1.2.13' \
              --latest \
              --notes 'Identity and installer-example hotfix. The XLX Modern distribution and modern dashboard are identified as maintained by Dario — PU2PNY; XLXD upstream authors LX3JL/LX1IQ and Daniel K. — PP5PK installer-base attribution are preserved. Installation examples now use XLX026 / xlx026.net. No runtime protocol, reflector-core, dashboard data-path or security behavior was changed.'
          fi
