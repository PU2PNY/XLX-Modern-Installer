name: XLX026 V11 Final Validation

on:
  pull_request:
    paths:
      - 'ops/agent/upgrade-v11-final.sh'
      - '.github/workflows/xlx026-v11-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate V11 blob and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/agent/upgrade-v11-final.sh
          test "$(git hash-object ops/agent/upgrade-v11-final.sh)" = "acfe070fd42e07774d2addde6f30bef55801204e"

      - name: Run V11 verify-only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env XLX026_V11_VERIFY_ONLY=1 bash ops/agent/upgrade-v11-final.sh

      - name: Validate listener/transcoder invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/agent/upgrade-v11-final.sh
          for token in \
            'EXPECTED_RELEASE_V9_BLOB="97faad18b30179cd1587a813479e56f8721b1d46"' \
            'EXPECTED_CANDIDATE_V2_SHA="10870cf84d91c936497c95c314a0b1eed79779e73260c7ec306cf6bba17632a7"' \
            '# XLX026_DYNAMIC_TRANSCODER_RANGE=10101-10199' \
            'port >= 10101 && port <= 10199' \
            "grep -Eq '(^|:)10100$'" \
            'CTranscoder::Init' \
            'CCodecStream::Init' \
            'dynamic_transcoder_listener_comparison=excluded_by_design' \
            'update_state_release_blob' \
            'bash "$V10"'
          do
            grep -Fq "$token" "$f"
          done
          ! grep -Eq 'make[[:space:]]+install' "$f"
          ! grep -Eq 'ufw|iptables|nft[[:space:]]' "$f"
