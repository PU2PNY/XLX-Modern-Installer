name: Fix dashboard screenshots

on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/*-fixed.b64'
      - '.github/workflows/fix-dashboard-screenshots.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode and validate screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f docs/screenshots/ao-vivo-xlx026-fixed.b64 ] || [ ! -f docs/screenshots/modulos-xlx026-fixed.b64 ]; then
            echo 'No pending screenshot payloads; nothing to do.'
            exit 0
          fi

          base64 --decode docs/screenshots/ao-vivo-xlx026-fixed.b64 > docs/screenshots/ao-vivo-xlx026.webp
          base64 --decode docs/screenshots/modulos-xlx026-fixed.b64 > docs/screenshots/modulos-xlx026.webp

          file docs/screenshots/ao-vivo-xlx026.webp
          file docs/screenshots/modulos-xlx026.webp

          test "$(dd if=docs/screenshots/ao-vivo-xlx026.webp bs=1 count=4 2>/dev/null)" = 'RIFF'
          test "$(dd if=docs/screenshots/ao-vivo-xlx026.webp bs=1 skip=8 count=4 2>/dev/null)" = 'WEBP'
          test "$(dd if=docs/screenshots/modulos-xlx026.webp bs=1 count=4 2>/dev/null)" = 'RIFF'
          test "$(dd if=docs/screenshots/modulos-xlx026.webp bs=1 skip=8 count=4 2>/dev/null)" = 'WEBP'

          rm -f docs/screenshots/ao-vivo-xlx026-fixed.b64
          rm -f docs/screenshots/modulos-xlx026-fixed.b64
          rm -f docs/screenshots/placeholder-fix-note.txt

      - name: Commit corrected screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git commit -m 'Fix dashboard screenshot binaries'
          git push origin HEAD:main
