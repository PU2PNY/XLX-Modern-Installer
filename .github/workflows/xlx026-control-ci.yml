name: XLX026 Legacy Control Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'control/xlx026-control-helper'
      - 'ops/root/install-xlx026-control-v1.sh'
      - '.github/workflows/xlx026-control-ci.yml'
  pull_request:
    paths:
      - 'control/xlx026-control-helper'
      - 'ops/root/install-xlx026-control-v1.sh'
      - '.github/workflows/xlx026-control-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n control/xlx026-control-helper
          bash -n ops/root/install-xlx026-control-v1.sh

      - name: Legacy helper invariants
        run: |
          grep -Fq 'EXPECTED_SHA="10870cf84d91c936497c95c314a0b1eed79779e73260c7ec306cf6bba17632a7"' control/xlx026-control-helper
          grep -Fq 'EXPECTED_VERSION="2.6.0"' control/xlx026-control-helper
          grep -Fq 'systemctl restart "$SERVICE"' control/xlx026-control-helper
          grep -Fq 'Uso permitido: status|listeners|logs|backups|restart' control/xlx026-control-helper
          ! grep -Eq 'eval |bash -c|sh -c|sudo +ALL|NOPASSWD: *ALL' control/xlx026-control-helper ops/root/install-xlx026-control-v1.sh

      - name: Immutable production installer pinning
        run: |
          grep -Fq 'SOURCE_COMMIT="ba01bf14857078129f42adb31694813fe6a4a7bd"' ops/root/install-xlx026-control-v1.sh
          grep -Fq 'INDEX_BLOB="c615cb8068d5d9ce900fc193ea771642f2206e94"' ops/root/install-xlx026-control-v1.sh
          grep -Fq 'HELPER_BLOB="dc78219b8a8a6fdfe6a364b2d422b5a5340e735c"' ops/root/install-xlx026-control-v1.sh
          grep -Fq 'EXPECTED_CORE_VERSION="2.6.0"' ops/root/install-xlx026-control-v1.sh
