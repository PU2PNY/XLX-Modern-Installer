name: Update beginner installer docs once

on:
  push:
    branches: [beginner-first-installer-v1.4.2]
    paths: ['.github/workflows/update-beginner-docs-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beginner-first-installer-v1.4.2

      - name: Apply guarded documentation patch
        run: python tools/update_beginner_docs_v142.py

      - name: Validate documentation result
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = "1.4.2"
          grep -Fq 'bash start.sh' README.md
          grep -Fq 'bash start.sh' README.pt-BR.md
          grep -Fq 'bash start.sh' README.en.md
          grep -Fq 'uma única sessão SSH' README.pt-BR.md
          grep -Fq 'one SSH session only' README.md
          grep -Fq '## v1.4.2' CHANGELOG.md
          ! grep -Fq '**Current release: v1.4.0**' README.md
          ! grep -Fq '**Versão atual: v1.4.0**' README.pt-BR.md

      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.pt-BR.md README.en.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: make beginner launcher the recommended path'
          git push origin HEAD:beginner-first-installer-v1.4.2
