name: One-shot fix Admin locale generator quoting

on:
  push:
    paths:
      - .github/workflows/one-shot-fix-admin-locale-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make generated translations safe for static PHP replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-shot-admin-six-locales.yml')
          s=p.read_text(encoding='utf-8')
          old='''                  out[pt]=translated\n'''
          new='''                  # The Admin baseline contains both single- and double-quoted PHP/JS strings.\n                  # Static localization must never inject syntax delimiters. Keep natural\n                  # typography while making the replacement safe in every source context.\n                  translated=translated.replace("'","’").replace('"','”').replace('\\\\','')\n                  out[pt]=translated\n'''
          if old not in s:
              raise SystemExit('translation assignment anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Publish workflow correction
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-fix-admin-locale-workflow.yml
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add .github/workflows/one-shot-admin-six-locales.yml .github/workflows/one-shot-fix-admin-locale-workflow.yml
          git commit -m 'Sanitize generated Admin locale text for PHP safety'
          git push origin HEAD:main
