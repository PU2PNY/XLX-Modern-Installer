name: Publish v1.2.12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.2.12.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and publish v1.2.12
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$TARGET_SHA"
          test "$TARGET_SHA" != "0000000000000000000000000000000000000000"
          test "$(git show "$TARGET_SHA:VERSION")" = "1.2.12"

          if ! git ls-remote --exit-code --tags origin refs/tags/v1.2.12 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.2.12 "$TARGET_SHA" -m "XLX Modern Installer v1.2.12"
            git push origin refs/tags/v1.2.12
          fi

          if ! gh release view v1.2.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > /tmp/release-notes.md <<'EOF'
          XLX Modern Installer v1.2.12

          Fresh-install runtime parity release for Debian 12.

          Highlights:
          - Synchronizes the generic installer with the current validated dashboard/runtime behavior.
          - Fixes weather fallback rendering.
          - Adds per-install CSS/JavaScript cache busting.
          - Removes obsolete standalone Bip menu exposure while preserving audio/accessibility behavior.
          - Adds final-render validation for status.php and live.php through Apache.
          - Requires readable XLXD XML, log and callsign database sources before fresh install proceeds.
          - Verifies Live, Connected, Modules, APRS/D-PRS, Certificates and Reflectors routes.
          - Normalizes Health PUBLIC_URL artifacts before observability installation.
          - Extends generated JavaScript syntax checks to all six dashboard languages.
          - Retains non-destructive Let's Encrypt retry behavior.

          Validation recorded for this release includes repository CI, public-release audit, production-parity regression, stream-identity regression and the Debian 12 runtime/Health gate.
          EOF

            gh release create v1.2.12 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "XLX Modern Installer v1.2.12" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
