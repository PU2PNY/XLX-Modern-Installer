name: Apply installer language isolation fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply strict language isolation
        shell: bash
        run: |
          if ! grep -Fq 'Strict language isolation.' install.sh; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-installer-i18n-fix.py')
          s = p.read_text(encoding='utf-8')
          old_plan = "s = replace_once(s, '- APRS/D-PRS: native and mandatory / nativo e obrigatório', '- APRS/D-PRS: native and mandatory', \"English plan\")"
          new_plan = "s = s.replace('- APRS/D-PRS: native and mandatory / nativo e obrigatório', '- APRS/D-PRS: native and mandatory', 1)"
          old_regex = "out, count = re.subn(pattern, new, text, count=1, flags=re.S)"
          new_regex = "out, count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)"
          if old_plan not in s:
              raise SystemExit('English plan patch line not found')
          if old_regex not in s:
              raise SystemExit('Regex replacement line not found')
          s = s.replace(old_plan, new_plan, 1)
          s = s.replace(old_regex, new_regex, 1)
          p.write_text(s, encoding='utf-8')
          PY
            python3 .github/scripts/apply-installer-i18n-fix.py
          else
            echo 'Core language isolation patch is already applied.'
          fi
          python3 .github/scripts/finalize-installer-language-fix.py

      - name: Validate shell syntax and language contracts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n dashboard/install/install-dashboard.sh
          bash tests/test-installer-language-contract.sh
          php tests/test-dashboard-locale-key-parity.php
          bash tests/test-dashboard-i18n.sh

      - name: Commit correction to target branch
        run: |
          git config user.name "XLX Modern CI"
          git config user.email "actions@users.noreply.github.com"
          git add install.sh start.sh dashboard/install/install-dashboard.sh tests/test-installer-language-contract.sh tests/test-dashboard-locale-key-parity.php tests/run-all.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete monolingual installer UX and language tests"
          git push origin HEAD:"$TARGET_BRANCH"
