name: Apply installer language isolation fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply strict language isolation
        run: python3 .github/scripts/apply-installer-i18n-fix.py

      - name: Validate shell syntax and language contracts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n dashboard/install/install-dashboard.sh
          bash tests/test-installer-language-contract.sh
          php tests/test-dashboard-locale-key-parity.php
          bash tests/test-dashboard-i18n.sh

      - name: Commit correction to pull request branch
        run: |
          git config user.name "XLX Modern CI"
          git config user.email "actions@users.noreply.github.com"
          git add install.sh start.sh dashboard/install/install-dashboard.sh tests/test-installer-language-contract.sh tests/test-dashboard-locale-key-parity.php tests/run-all.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix strict installer and dashboard language isolation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
