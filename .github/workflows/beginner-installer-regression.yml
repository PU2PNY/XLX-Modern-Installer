name: Classic installer regression

on:
  push:
    branches: [main]
    paths:
      - 'start.sh'
      - 'install.sh'
      - 'vendor/pp5pk-installer/installer.sh'
      - 'modules/60-dashboard-modern.sh'
      - 'modules/66-certificates.sh'
      - 'modules/67-aprs-dprs.sh'
      - 'VERSION'
      - '.github/workflows/beginner-installer-regression.yml'
  pull_request:
    paths:
      - 'start.sh'
      - 'install.sh'
      - 'vendor/pp5pk-installer/installer.sh'
      - 'modules/60-dashboard-modern.sh'
      - 'modules/66-certificates.sh'
      - 'modules/67-aprs-dprs.sh'
      - 'VERSION'
      - '.github/workflows/beginner-installer-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          set -Eeuo pipefail
          bash -n start.sh
          bash -n install.sh
          bash -n vendor/pp5pk-installer/installer.sh
          bash -n modules/60-dashboard-modern.sh
          bash -n modules/66-certificates.sh
          bash -n modules/67-aprs-dprs.sh

      - name: Verify classic bilingual flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          start = Path('start.sh').read_text()
          install = Path('install.sh').read_text()
          vendor = Path('vendor/pp5pk-installer/installer.sh').read_text()
          dashboard_module = Path('modules/60-dashboard-modern.sh').read_text()
          dashboard = Path('dashboard/index.php').read_text()

          assert 'MODO SIMPLES / SIMPLE MODE' in start
          assert 'exec bash "$ROOT_DIR/install.sh" "$@" --classic' in start
          assert 'simple_installer.py' not in start
          assert 'tmux -L "$TMUX_SOCKET"' not in start
          assert 'TUI_MODE="off"' in install

          # The localized runtime is produced by sed expressions in install.sh.
          # Validate the actual one-backslash sed markers (01\., 02\., ...),
          # not a doubly escaped representation that never exists in the file.
          for number in range(1, 22):
              prefix = f'{number:02d}.'
              assert prefix in vendor, f'missing vendor question {prefix}'
              sed_marker = f'{number:02d}' + r'\.'
              assert sed_marker in install, f'missing bilingual rewrite for question {prefix}'

          for marker in (
              'DADOS DO REFLETOR / REFLECTOR DATA INPUT',
              'REVISE AS CONFIGURAÇÕES / REVIEW YOUR SETTINGS:',
              'Configurações corretas? [ENTER] confirma',
              '[[ "$INSTALL_SSL" == "S" ]] && INSTALL_SSL="Y"',
              '[[ "$INSTALL_ECHO" == "S" ]] && INSTALL_ECHO="Y"',
              '[[ "$AUTOLINK_USER" == "S" ]] && AUTOLINK_USER="Y"',
          ):
              assert marker in install, marker

          review_at = vendor.index('Settings correct?')
          assert vendor[review_at:].count('read -r') == 1
          execute_at = install.index('execute_installer()')
          post = install[execute_at:install.index('\nmain()', execute_at)]
          assert 'read -r' not in post

          assert 'modules/66-certificates.sh' in dashboard_module
          assert 'modules/67-aprs-dprs.sh' in install
          assert "'certificado'" in dashboard
          assert "'digital-lab'" in dashboard

          m = re.search(r'EXPECTED_INSTALLER_SHA256="([0-9a-f]{64})"', install)
          assert m
          actual = hashlib.sha256(Path('vendor/pp5pk-installer/installer.sh').read_bytes()).hexdigest()
          assert m.group(1) == actual
          assert Path('VERSION').read_text().strip() == '1.4.6'
          PY
