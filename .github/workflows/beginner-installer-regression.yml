name: Beginner installer regression

on:
  push:
    branches:
      - beginner-first-installer-v1.4.2
      - main
    paths:
      - 'start.sh'
      - 'tui/simple_installer.py'
      - 'tui/requirements.txt'
      - '.github/workflows/beginner-installer-regression.yml'
  pull_request:
    paths:
      - 'start.sh'
      - 'tui/simple_installer.py'
      - 'tui/requirements.txt'
      - '.github/workflows/beginner-installer-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Textual
        run: python -m pip install --disable-pip-version-check -r tui/requirements.txt

      - name: Validate shell and Python syntax
        run: |
          set -Eeuo pipefail
          bash -n start.sh
          python -m py_compile tui/simple_installer.py
          python tui/simple_installer.py --self-test

      - name: Mount the beginner interface headlessly
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          from pathlib import Path

          module_path = Path('tui/simple_installer.py').resolve()
          spec = importlib.util.spec_from_file_location('xlx_simple', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          async def verify():
              app = module.SimpleInstaller(Path.cwd())
              async with app.run_test(size=(130, 44)) as pilot:
                  await pilot.pause()
                  assert app.step == 0
                  assert app.query_one('#lang-pt').label.plain == 'Português (Brasil)'
                  assert app.query_one('#lang-en').label.plain == 'English'
                  app.set_language('pt-BR')
                  await pilot.pause()
                  assert app.step == 1
                  assert app.query_one('#reflector_id')
                  assert app.query_one('#ysf_id')
                  assert app.query_one('#next').label.plain == 'Continuar →'
                  assert app.query_one('#help-ysf_id').render().plain == 'Exemplo: 12345'
                  app.query_one('#reflector_id').value = 'PNY'
                  app.query_one('#domain').value = 'xlx026.net'
                  app.query_one('#callsign').value = 'PU2PNY'
                  app.query_one('#email').value = 'sysop@example.net'
                  app.query_one('#country').value = 'Brazil'
                  app.query_one('#location').value = 'Santa Isabel - SP'
                  app.query_one('#ysf_id').value = '12345'
                  assert app.validate_step(1)
                  app.show_step(2)
                  app.query_one('#admin_password').value = 'ExampleOnly-123!'
                  app.query_one('#admin_password_confirm').value = 'ExampleOnly-123!'
                  assert app.validate_step(2)
                  assert app.data['admin_user'] == 'pu2pny'
                  assert app.data['admin_slug'] == 'controle-pny'
                  app.show_step(3)
                  await pilot.pause()
                  assert app.query_one('#next').label.plain == 'INSTALAR AGORA'

          asyncio.run(verify())
          PY

      - name: Verify beginner-first UX rules
        run: |
          set -Eeuo pipefail
          grep -Fq 'Nenhuma resposta é necessária nesta etapa' start.sh
          grep -Fq 'tmux has-session' start.sh
          grep -Fq 'Reabrindo a mesma sessão' start.sh
          grep -Fq 'Exemplo: 12345' tui/simple_installer.py
          grep -Fq 'Enter = próxima resposta' tui/simple_installer.py
          grep -Fq 'INSTALAR AGORA' tui/simple_installer.py
          grep -Fq 'Configuração automática recomendada' tui/simple_installer.py
          ! grep -Fq 'ssh -L' start.sh
          ! grep -Fq 'OUTRO terminal' start.sh
