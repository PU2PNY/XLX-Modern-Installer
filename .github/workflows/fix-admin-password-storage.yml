name: Fix Admin password storage validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-password-storage.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace false-positive plaintext detector
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/68-control-panel.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'SOURCE_ACCESS="$ROOT/control/xlx-modern-access-helper"\n',
              'SOURCE_ACCESS="$ROOT/control/xlx-modern-access-helper"\nPASSWORD_VALIDATOR="$ROOT/control/validate-password-storage.php"\n',
              1,
          )
          s = s.replace(
              '  for file in "$BASE_INDEX" "$GENERICIZER" "$SOURCE_HELPER" "$SOURCE_RADIO" "$SOURCE_ACCESS"; do\n',
              '  for file in "$BASE_INDEX" "$GENERICIZER" "$SOURCE_HELPER" "$SOURCE_RADIO" "$SOURCE_ACCESS" "$PASSWORD_VALIDATOR"; do\n',
              1,
          )
          s = s.replace(
              '  python3 -m py_compile "$GENERICIZER"\n',
              '  python3 -m py_compile "$GENERICIZER"\n  php -l "$PASSWORD_VALIDATOR" >/dev/null\n',
              1,
          )
          old1 = 'if grep -Fq "$PASSWORD" "$TMP/config.php"; then fail "$(say \'senha em texto puro detectada\' \'plain-text password detected\')"; exit 30; fi'
          new1 = 'if ! printf \'%s\' "$PASSWORD" | php "$PASSWORD_VALIDATOR" "$TMP/config.php"; then fail "$(say \'armazenamento de senha inválido no candidato\' \'invalid password storage in candidate config\')"; exit 30; fi'
          if old1 not in s:
              raise SystemExit('candidate plaintext detector not found')
          s = s.replace(old1, new1, 1)
          old2 = 'step6_check "$(say \'credencial Admin validada\' \'Admin credential validated\')" php -r \'$c=require $argv[1]; exit(($c["username"]===$argv[2] && password_verify($argv[3],$c["password_hash"]))?0:1);\' "$CFG_FILE" "$USERNAME" "$PASSWORD"\nif grep -Fq "$PASSWORD" "$CFG_FILE"; then fail "$(say \'senha em texto puro detectada após instalação\' \'Plain-text password detected after installation\')"; exit 60; fi\nok "$(say \'senha armazenada somente como hash\' \'Password stored as hash only\')"'
          new2 = 'if printf \'%s\' "$PASSWORD" | php -r \'$c=require $argv[1];$p=stream_get_contents(STDIN);exit(($c["username"]===$argv[2] && password_verify($p,$c["password_hash"]))?0:1);\' "$CFG_FILE" "$USERNAME"; then\n  ok "$(say \'credencial Admin validada\' \'Admin credential validated\')"\nelse\n  fail "$(say \'credencial Admin inválida\' \'Invalid Admin credential\')"; exit 60\nfi\nif ! printf \'%s\' "$PASSWORD" | php "$PASSWORD_VALIDATOR" "$CFG_FILE"; then fail "$(say \'armazenamento de senha inválido após instalação\' \'Invalid password storage after installation\')"; exit 60; fi\nok "$(say \'senha armazenada somente como hash\' \'Password stored as hash only\')"'
          if old2 not in s:
              raise SystemExit('installed plaintext detector block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

          cat > control/validate-password-storage.php <<'PHP'
          <?php
          declare(strict_types=1);

          if ($argc !== 2) {
              fwrite(STDERR, "usage: validate-password-storage.php CONFIG\n");
              exit(64);
          }

          $configFile = $argv[1];
          $password = stream_get_contents(STDIN);
          if ($password === false || $password === '') {
              fwrite(STDERR, "password input missing\n");
              exit(65);
          }

          $config = require $configFile;
          if (!is_array($config)) {
              fwrite(STDERR, "config is not an array\n");
              exit(66);
          }

          $hash = $config['password_hash'] ?? null;
          if (!is_string($hash) || $hash === '' || !password_verify($password, $hash)) {
              fwrite(STDERR, "password_hash verification failed\n");
              exit(67);
          }

          $info = password_get_info($hash);
          if (($info['algoName'] ?? 'unknown') === 'unknown') {
              fwrite(STDERR, "password_hash algorithm is invalid\n");
              exit(68);
          }

          $containsPlaintextPasswordField = static function (mixed $node) use (&$containsPlaintextPasswordField, $password): bool {
              if (!is_array($node)) {
                  return false;
              }
              foreach ($node as $key => $value) {
                  $keyString = (string)$key;
                  if ($keyString === 'password_hash') {
                      continue;
                  }
                  if (preg_match('/(?:^|_)(?:password|passwd|passphrase)(?:_|$)/i', $keyString) === 1) {
                      if (is_scalar($value) && hash_equals($password, (string)$value)) {
                          return true;
                      }
                  }
                  if (is_array($value) && $containsPlaintextPasswordField($value)) {
                      return true;
                  }
              }
              return false;
          };

          if ($containsPlaintextPasswordField($config)) {
              fwrite(STDERR, "plain-text password field detected\n");
              exit(69);
          }

          exit(0);
          PHP

          cat > tests/test-admin-password-storage-contract.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          TMP="$(mktemp -d /tmp/xlx-password-contract.XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          PASS='controle'
          HASH="$(printf '%s' "$PASS" | php -r '$p=stream_get_contents(STDIN);echo password_hash($p,PASSWORD_DEFAULT);')"

          cat > "$TMP/good.php" <<PHP
          <?php
          return ['username'=>'controle','password_hash'=>'$HASH','title'=>'Admin XLXPNY'];
          PHP
          printf '%s' "$PASS" | php "$ROOT/control/validate-password-storage.php" "$TMP/good.php"

          cat > "$TMP/bad-plain.php" <<PHP
          <?php
          return ['username'=>'controle','password_hash'=>'$HASH','password'=>'controle'];
          PHP
          if printf '%s' "$PASS" | php "$ROOT/control/validate-password-storage.php" "$TMP/bad-plain.php" >/dev/null 2>&1; then
            echo 'FAIL | plaintext password field was accepted' >&2
            exit 1
          fi

          cat > "$TMP/bad-hash.php" <<'PHP'
          <?php
          return ['username'=>'controle','password_hash'=>'not-a-password-hash'];
          PHP
          if printf '%s' "$PASS" | php "$ROOT/control/validate-password-storage.php" "$TMP/bad-hash.php" >/dev/null 2>&1; then
            echo 'FAIL | invalid hash was accepted' >&2
            exit 1
          fi

          if grep -Fq 'grep -Fq "$PASSWORD"' "$ROOT/modules/68-control-panel.sh"; then
            echo 'FAIL | old whole-file plaintext grep is still present' >&2
            exit 1
          fi
          grep -Fq 'validate-password-storage.php' "$ROOT/modules/68-control-panel.sh"
          echo 'OK | username may equal password without false positive; plaintext password fields remain rejected'
          SH
          chmod +x tests/test-admin-password-storage-contract.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/run-all.sh')
          s = p.read_text(encoding='utf-8')
          anchor = 'echo "[admin route readiness]"\nbash "$ROOT/tests/test-admin-route-readiness.sh" || failures=$((failures+1))\n'
          insert = 'echo "[admin password storage contract]"\nbash "$ROOT/tests/test-admin-password-storage-contract.sh" || failures=$((failures+1))\n'
          if insert not in s:
              if anchor not in s:
                  raise SystemExit('run-all anchor not found')
              s = s.replace(anchor, anchor + insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli sqlite3 >/dev/null
          bash -n modules/68-control-panel.sh tests/test-admin-password-storage-contract.sh tests/run-all.sh
          php -l control/validate-password-storage.php
          bash tests/test-admin-password-storage-contract.sh
          bash tests/test-install-flow.sh
          git diff --check

      - name: Publish repair and remove one-shot workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add modules/68-control-panel.sh control/validate-password-storage.php tests/test-admin-password-storage-contract.sh tests/run-all.sh
          git commit -m 'Fix Admin password-storage false positive'
          git push origin HEAD:main
          git rm .github/workflows/fix-admin-password-storage.yml
          git commit -m 'Remove one-shot Admin password-storage repair'
          git push origin HEAD:main
