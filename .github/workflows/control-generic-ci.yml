name: XLX Modern Control CI

on:
  push:
    paths:
      - 'control/index.php'
      - 'control/xlx-modern-control-helper'
      - 'control/README.md'
      - 'modules/68-control-panel.sh'
      - 'install-control.sh'
      - '.github/workflows/control-generic-ci.yml'
  pull_request:
    paths:
      - 'control/index.php'
      - 'control/xlx-modern-control-helper'
      - 'control/README.md'
      - 'modules/68-control-panel.sh'
      - 'install-control.sh'
      - '.github/workflows/control-generic-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install-control.sh
          bash -n modules/68-control-panel.sh
          bash -n control/xlx-modern-control-helper

      - name: PHP syntax
        run: php -l control/index.php

      - name: Generic identity invariants
        run: |
          ! grep -En 'https://xlx026\.net|Controle XLX026|/etc/xlx026-control|/var/lib/xlx026-control|/usr/local/sbin/xlx026-control-helper' control/index.php control/xlx-modern-control-helper install-control.sh
          ! grep -En '^(CONTROL_USERNAME|USERNAME|DOMAIN|BASE_URL)=.*(queuspa|xlx026)' modules/68-control-panel.sh
          grep -Fq "/etc/xlx-modern-control/config.php" control/index.php
          grep -Fq "/usr/local/sbin/xlx-modern-control-helper" control/index.php
          grep -Fq 'TITLE="Controle $REFLECTOR_NAME"' modules/68-control-panel.sh

      - name: Credential safety invariants
        run: |
          grep -Fq 'password_hash($p,PASSWORD_DEFAULT)' modules/68-control-panel.sh
          grep -Fq 'password_verify' control/index.php
          grep -Fq 'Repita a senha:' modules/68-control-panel.sh
          grep -Fq 'senha não será exibida nem persistida em texto puro' modules/68-control-panel.sh
          ! grep -En '^PASSWORD=["'"'][^$][^"'"']+["'"']$' modules/68-control-panel.sh

      - name: Filesystem and sudo invariants
        run: |
          grep -Fq 'install -d -o root -g www-data -m 0755 "$CONTROL_DIR"' modules/68-control-panel.sh
          grep -Fq 'install -o root -g root -m 0600 "$TMP/helper.conf" "$HELPER_CONF"' modules/68-control-panel.sh
          grep -Fq 'NOPASSWD: $HELPER status' modules/68-control-panel.sh
          grep -Fq 'NOPASSWD: $HELPER restart' modules/68-control-panel.sh
          ! grep -Eq 'NOPASSWD:[[:space:]]+ALL' modules/68-control-panel.sh

      - name: No arbitrary web shell surface
        run: |
          ! grep -En '\$_(GET|POST|REQUEST).*cmd|shell_exec\(|passthru\(|proc_open\(|popen\(' control/index.php
          grep -Fq "['status', 'listeners', 'logs', 'backups', 'restart']" control/index.php
          grep -Fq 'Uso permitido: status|listeners|logs|backups|restart' control/xlx-modern-control-helper
