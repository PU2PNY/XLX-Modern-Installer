name: Repair Admin route timing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      BLOCK_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Admin route timing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('modules/69-admin-page.sh')
          s = p.read_text(encoding='utf-8')
          start = s.index('# Prove the configured private route over whichever local web scheme is')
          end = s.index('\nSUCCESS=1', start)
          block = base64.b64decode(os.environ['BLOCK_B64']).decode('utf-8')
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          t = Path('tests/test-admin-route-readiness.sh')
          lines = t.read_text(encoding='utf-8').splitlines()
          out = []
          inserted = False
          for line in lines:
              if 'Admin installer must probe HTTP when TLS is pending' in line:
                  continue
              if 'Admin installer local route probe is missing' in line:
                  continue
              if not inserted and 'ADMIN_ROUTE_FILE=' in line:
                  out.append("grep -Fq 'FINAL_ADMIN_EDGE_READY=0' \"$ROOT/modules/69-admin-page.sh\" || fail 'Admin installer must distinguish the pre-Nginx stage'")
                  out.append("grep -Fq 'HTTP proof deferred until final Nginx/PHP-FPM activation' \"$ROOT/modules/69-admin-page.sh\" || fail 'pre-edge Admin route deferral marker is missing'")
                  inserted = True
              out.append(line)
          if not inserted:
              raise SystemExit('route readiness test anchor missing')
          t.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n modules/69-admin-page.sh
          bash tests/test-admin-route-readiness.sh
          bash tests/test-admin-slug-contract.sh
          bash tests/test-admin-password-storage-contract.sh
          git diff --check

      - name: Publish repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'PU2PNY Automation'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git rm .github/workflows/fix-admin-preedge-route.yml
          git add modules/69-admin-page.sh tests/test-admin-route-readiness.sh
          git commit -m 'Defer Admin route probe until final Nginx edge'
          git push origin HEAD:main
