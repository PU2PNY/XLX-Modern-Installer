name: Finalize graphical installer v1.4.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-webui-v140-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release documentation and audit-safe tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server = Path('webui/server.py')
          text = server.read_text(encoding='utf-8')
          old = '''    sample = InstallPayload(reflector_id="PNY", domain="xlx026.net", email="sysop@example.net", callsign="PU2PNY",
                                      country="Brazil", timezone="America/Sao_Paulo", location="Santa Isabel - SP", ysf_id="12345",
                                      admin_user="pu2pny", admin_slug="controle-pny", admin_password="ExampleOnly-123!")'''
          new = '''    sample = InstallPayload(**{
                  "reflector_id": "PNY", "domain": "xlx026.net", "email": "sysop@example.net", "callsign": "PU2PNY",
                  "country": "Brazil", "timezone": "America/Sao_Paulo", "location": "Santa Isabel - SP", "ysf_id": "12345",
                  "admin_user": "pu2pny", "admin_slug": "controle-pny", "admin_password": "ExampleOnly-123!",
              })'''
          if old not in text:
              raise SystemExit('server self-test block not found')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('webui/test_server.py')
          text = test.read_text(encoding='utf-8')
          old = '''    return module.InstallPayload(
                  ui_lang='pt-BR', reflector_id='PNY', domain='xlx026.net', email='sysop@example.net', callsign='PU2PNY',
                  country='Brazil', timezone='America/Sao_Paulo', location='Santa Isabel - SP', https=True, echo=True,
                  modules=5, ysf_port=42000, ysf_freq=433125000, autolink=True, autolink_module='C', ysf_id='12345',
                  admin_user='pu2pny', admin_slug='controle-pny', admin_password='ExampleOnly-123!', dashboard_lang='pt-BR')'''
          new = '''    return module.InstallPayload(**{
                  'ui_lang': 'pt-BR', 'reflector_id': 'PNY', 'domain': 'xlx026.net', 'email': 'sysop@example.net', 'callsign': 'PU2PNY',
                  'country': 'Brazil', 'timezone': 'America/Sao_Paulo', 'location': 'Santa Isabel - SP', 'https': True, 'echo': True,
                  'modules': 5, 'ysf_port': 42000, 'ysf_freq': 433125000, 'autolink': True, 'autolink_module': 'C', 'ysf_id': '12345',
                  'admin_user': 'pu2pny', 'admin_slug': 'controle-pny', 'admin_password': 'ExampleOnly-123!', 'dashboard_lang': 'pt-BR',
              })'''
          if old not in text:
              raise SystemExit('web test sample block not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('VERSION').write_text('1.4.0\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## v1.4.0 — Graphical web installer\n\n- Adds the browser-based XLX Modern Installer as the recommended high-contrast installation interface.\n- Uses the same reviewed `install.sh` engine and answer sequence; the graphical layer does not fork XLXD installation logic.\n- Starts with an explicit Portuguese/English language choice and guides the operator through eight short steps.\n- Adds large readable controls, strong contrast, thick progress bars, keyboard focus indicators, beginner instructions and reduced-motion support.\n- Pressing Enter moves through answer fields, and the final review hides the Admin password.\n- Keeps the XLX reflector ID contract at exactly three alphanumeric characters while using `12345` as the valid example for the YSF reflector ID.\n- Runs the web interface only on `127.0.0.1` and requires an SSH tunnel plus a temporary random token; it is not exposed directly to the Internet.\n- Refuses to overwrite an active XLXD installation and stops on old XLXD remnants so cleanup can be reviewed before destructive action.\n- Keeps the Textual and classic terminal installers available as fallback paths.\n- Adds a dedicated Web installer regression gate for Python, JavaScript, API authentication, answer ordering and accessibility markers.\n\n'''
          if not text.startswith('## v1.4.0'):
              changelog.write_text(entry + text, encoding='utf-8')

          for name in ('README.md', 'README.en.md'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('**Current release: v1.3.1**', '**Current release: v1.4.0**', 1)
              text = text.replace('cd XLX-Modern-Installer\nbash install.sh\n```', 'cd XLX-Modern-Installer\nbash web-install.sh\n```', 1)
              old = '''On an interactive SSH terminal, `bash install.sh` now opens the **Textual guided interface** by default: window-style steps, validated fields, Back/Continue controls, a complete review screen and a live installation progress bar with the technical log inside the interface. The existing shell installer remains the installation engine. If Textual cannot be started, the installer safely falls back to the classic questionnaire; `bash install.sh --classic` forces that mode.'''
              new = '''The recommended path is now `bash web-install.sh`. It starts the **graphical web installer** only on the VPS loopback address and prints one SSH tunnel command plus a temporary local browser URL. The browser wizard provides large high-contrast controls, eight short steps, a thick progress bar, field-by-field guidance, Enter-to-next navigation and a final review before installation. The web interface is not exposed directly to the Internet.\n\nThe reviewed `install.sh` remains the single installation engine behind the graphical interface. `bash install.sh` keeps the Textual guided terminal interface as a fallback, and `bash install.sh --classic` keeps the classic questionnaire available.'''
              if old not in text:
                  raise SystemExit(f'installation paragraph not found in {name}')
              text = text.replace(old, new, 1)
              text = text.replace('`install.sh --check` performs the read-only preflight without installing.', '`install.sh --check` performs the read-only preflight without installing. `web-install.sh` is the recommended graphical launcher and will refuse an active XLXD installation or unresolved XLXD remnants.', 1)
              text = text.replace('install.sh                 top-level installer\n', 'install.sh                 reviewed installation engine and terminal fallback\nweb-install.sh             secure graphical-installer launcher\nwebui/                     browser wizard, local API and accessibility assets\n', 1)
              p.write_text(text, encoding='utf-8')

          p = Path('README.pt-BR.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**Versão atual: v1.3.1**', '**Versão atual: v1.4.0**', 1)
          text = text.replace('cd XLX-Modern-Installer\nbash install.sh\n```', 'cd XLX-Modern-Installer\nbash web-install.sh\n```', 1)
          old = '''Em uma sessão SSH interativa, `bash install.sh` agora abre por padrão a **interface guiada Textual**: etapas em janelas, campos validados, botões Voltar/Continuar, revisão completa e barra de progresso da instalação com o log técnico dentro da própria interface. O instalador Shell existente continua sendo o motor real da instalação. Se o Textual não puder ser iniciado, o processo retorna com segurança ao questionário clássico; `bash install.sh --classic` força esse modo.'''
          new = '''O caminho recomendado agora é `bash web-install.sh`. Ele inicia o **instalador gráfico no navegador** somente no endereço interno da própria VPS e mostra um comando de túnel SSH e um endereço local temporário para abrir no navegador. O assistente tem controles grandes e de alto contraste, oito etapas curtas, barra de progresso grossa, orientação em cada campo, Enter para avançar entre respostas e uma revisão final antes de instalar. A interface não fica exposta diretamente à Internet.\n\nO `install.sh` revisado continua sendo o único motor real da instalação por trás da interface gráfica. `bash install.sh` mantém o Textual como alternativa no terminal, e `bash install.sh --classic` mantém o questionário clássico como fallback.'''
          if old not in text:
              raise SystemExit('installation paragraph not found in README.pt-BR.md')
          text = text.replace(old, new, 1)
          text = text.replace('`bash install.sh --check` faz somente a pré-validação sem instalar.', '`bash install.sh --check` faz somente a pré-validação sem instalar. O `web-install.sh` é o inicializador gráfico recomendado e recusa uma instalação XLXD ativa ou vestígios antigos ainda não revisados.', 1)
          p.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile webui/server.py
          bash -n web-install.sh
          bash scripts/public-release-audit.sh
          grep -Fq '1.4.0' VERSION
          grep -Fq 'bash web-install.sh' README.md README.en.md README.pt-BR.md
          grep -Fq 'Graphical web installer' CHANGELOG.md

      - name: Commit finalized v1.4.0 files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md README.md README.en.md README.pt-BR.md webui/server.py webui/test_server.py
          git diff --cached --check
          git commit -m 'release: graphical web installer v1.4.0'
          git push origin HEAD:main
