name: Textual installer regression

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'tui/**'
      - 'vendor/pp5pk-installer/installer.sh'
      - '.github/workflows/tui-regression.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'tui/**'
      - 'vendor/pp5pk-installer/installer.sh'
      - '.github/workflows/tui-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Textual
        run: python -m pip install --disable-pip-version-check -r tui/requirements.txt
      - name: Validate Python and answer sequencing
        run: |
          python -m py_compile tui/installer.py
          python tui/installer.py --self-test
      - name: Mount the real interface headlessly
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          from pathlib import Path

          module_path = Path('tui/installer.py').resolve()
          spec = importlib.util.spec_from_file_location('xlx_tui', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          async def verify_ui():
              app = module.XLXInstallerApp(Path.cwd())
              async with app.run_test(size=(140, 45)) as pilot:
                  await pilot.pause()
                  assert app.query_one('#reflector_id')
                  assert app.query_one('#domain')
                  assert app.query_one('#next')
                  assert app.query_one('#progress')
                  assert app.query_one('#install-log')
                  assert app.current_step == 0

          asyncio.run(verify_ui())
          PY
      - name: Validate shell syntax and integrity pin
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n vendor/pp5pk-installer/installer.sh
          expected="$(sed -n 's/^readonly EXPECTED_INSTALLER_SHA256="\([0-9a-f]*\)"$/\1/p' install.sh)"
          actual="$(sha256sum vendor/pp5pk-installer/installer.sh | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
