name: Textual installer regression

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'tui/**'
      - 'vendor/pp5pk-installer/installer.sh'
      - '.github/workflows/tui-regression.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'tui/**'
      - 'vendor/pp5pk-installer/installer.sh'
      - '.github/workflows/tui-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Textual
        run: python -m pip install --disable-pip-version-check -r tui/requirements.txt
      - name: Validate Python and answer sequencing
        run: |
          python -m py_compile tui/installer.py
          python tui/installer.py --self-test
      - name: Mount beginner wizard and validate Enter navigation
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          from pathlib import Path
          from textual.widgets import Button, Input

          module_path = Path('tui/installer.py').resolve()
          spec = importlib.util.spec_from_file_location('xlx_tui', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          async def verify_ui():
              app = module.XLXInstallerApp(Path.cwd())
              async with app.run_test(size=(150, 52)) as pilot:
                  await pilot.pause()
                  assert app.current_step == 0
                  assert app.query_one('#lang-pt', Button)
                  assert app.query_one('#lang-en', Button)
                  assert app.query_one('#wizard-progress')
                  assert app.query_one('#guide')
                  assert app.query_one('#next').styles.display == 'none'

                  await pilot.click('#lang-pt')
                  await pilot.pause()
                  assert app.current_step == 1

                  rid = app.query_one('#reflector_id', Input)
                  rid.value = 'PNY'
                  rid.focus()
                  await pilot.press('enter')
                  await pilot.pause()
                  assert app.focused is not None and app.focused.id == 'domain'

                  app.query_one('#domain', Input).value = 'xlx026.net'
                  await pilot.press('enter')
                  await pilot.pause()
                  assert app.focused is not None and app.focused.id == 'callsign'

                  app.query_one('#callsign', Input).value = 'PU2PNY'
                  await pilot.press('enter')
                  app.query_one('#email', Input).value = 'sysop@example.net'
                  await pilot.press('enter')
                  await pilot.pause()
                  assert app.focused is not None and app.focused.id == 'next'

                  assert app.query_one('#install-progress')
                  assert app.query_one('#install-detail')
                  assert app.query_one('#next').styles.background is not None
                  assert app.query_one('#cancel').styles.background is not None

          asyncio.run(verify_ui())
          PY
      - name: Validate shell syntax and integrity pin
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n vendor/pp5pk-installer/installer.sh
          expected="$(sed -n 's/^readonly EXPECTED_INSTALLER_SHA256="\([0-9a-f]*\)"$/\1/p' install.sh)"
          actual="$(sha256sum vendor/pp5pk-installer/installer.sh | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
