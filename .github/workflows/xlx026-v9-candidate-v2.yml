name: XLX026 V9 Candidate V2 Validation

on:
  pull_request:
    paths:
      - 'ops/agent/upgrade-v9.sh'
      - 'ops/root/xlx026-core-260-candidate-v1.sh'
      - '.github/workflows/xlx026-v9-candidate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and immutable blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/agent/upgrade-v9.sh
          test "$(git hash-object ops/agent/upgrade-v9.sh)" = "4879bd3b1a81ba141122d595705307538901d5d9"
          test "$(git hash-object ops/root/xlx026-core-260-candidate-v1.sh)" = "c5194e7597145e3b6f6621485108abdeec02b8e7"

      - name: Validate embedded Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('ops/agent/upgrade-v9.sh').read_text(encoding='utf-8')
          blocks=re.findall(r"<<'PY'\n(.*?)\nPY\n", s, flags=re.S)
          assert len(blocks) == 2, len(blocks)
          for i,b in enumerate(blocks,1):
              compile(b, f'embedded-v9-{i}.py', 'exec')
          print('embedded_python_blocks=',len(blocks))
          PY

      - name: Verify Candidate V2 operational profile and source fingerprints
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/agent/upgrade-v9.sh
          for token in \
            'EXPECTED_MAINH_SHA="72a0f60786fdb7d6f3bfd02783728a5fa4f3b51867bd9d021aa2ea0deaef2fbc"' \
            'EXPECTED_MAINH_BACKUP_SHA="49902efee053ed760dd99d42b52c391f598abab8d91ef8726b2996bf0c0c2cec"' \
            'CANDIDATE_V1_BLOB="c5194e7597145e3b6f6621485108abdeec02b8e7"' \
            'PRECHECK_V8_BLOB="074499e783377cabaf11c814fce634240719efa9"' \
            'RELEASE_V8_BLOB="0cccbb4f7a3d873b3229614eb1f85a2f84de7b33"' \
            'CANDIDATE_V2_STATIC_OK' \
            'NB_OF_MODULES                   5' \
            'DMRMMDVM_KEEPALIVE_TIMEOUT      180' \
            'YSF_KEEPALIVE_TIMEOUT           90' \
            'YSF_DEFAULT_NODE_TX_FREQ        433125000' \
            'YSF_DEFAULT_NODE_RX_FREQ        433125000' \
            'YSF_AUTOLINK_ENABLE             1' \
            "YSF_AUTOLINK_MODULE             'C'" \
            'disabled_protocol_handlers=M17,NXDN,P25'
          do
            grep -Fq "$token" "$f"
          done

      - name: Guard V9 production boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/agent/upgrade-v9.sh
          ! grep -Eq 'make[[:space:]]+install' "$f"
          ! grep -Eq 'systemctl[[:space:]]+(restart|stop)[[:space:]].*xlxd' "$f"
          ! grep -Eq 'mv[^\n]*/xlxd/xlxd|install[^\n]*/xlxd/xlxd' "$f"
          grep -Fq 'Produção continua XLXD 2.5.3 sem restart.' "$f"
