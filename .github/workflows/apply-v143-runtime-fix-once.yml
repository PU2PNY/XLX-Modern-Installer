name: Apply v1.4.3 runtime fix once

on:
  push:
    branches: [installer-v1.4.3-usability-runtime-fix]
    paths: ['.github/workflows/apply-v143-runtime-fix-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: installer-v1.4.3-usability-runtime-fix

      - name: Apply guarded patch
        run: python tools/patch_v143_runtime_once.py

      - name: Validate patched files
        run: |
          set -Eeuo pipefail
          bash -n start.sh
          bash -n tui/run-simple.sh
          python -m py_compile tui/simple_installer.py
          test "$(cat VERSION)" = "1.4.3"
          grep -Fq 'write_ui_state("MOUNTED")' tui/simple_installer.py
          grep -Fq 'write_ui_state("USER_CLOSED")' tui/simple_installer.py
          ! grep -Fq '[f][b]Domínio[/b][/f]' tui/simple_installer.py
          grep -Fq '## v1.4.3' CHANGELOG.md

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tui/simple_installer.py VERSION README.md README.pt-BR.md README.en.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: harden beginner installer v1.4.3'
          git push origin HEAD:installer-v1.4.3-usability-runtime-fix
